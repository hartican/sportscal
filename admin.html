<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Owner console · Nothing Sport</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#17171b;--panel-2:#101013;--line:#34343b;--text:#fafafa;--muted:#aaaab2;--pink:#ff2d8d;--cyan:#19d3ef;--green:#60d985;--amber:#ffc857;--danger:#ff9494;font:15px/1.45 Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button,.button{border:0;border-radius:999px;padding:10px 16px;background:var(--pink);color:#09090b;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.secondary,.button.secondary{background:#292930;color:#fff;border:1px solid #44444d}button.danger{background:#4b202a;color:#ffdce5;border:1px solid #763044}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#0d0d10;color:#fff}input[type=checkbox]{width:auto;accent-color:var(--pink)}textarea{resize:vertical}.admin-shell{width:min(1220px,100%);margin:auto;padding:24px}.admin-header{display:flex;align-items:center;gap:22px;justify-content:space-between;margin-bottom:20px}.admin-logo{width:190px;display:block}.admin-title{font-weight:900}.admin-nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:22px}.admin-nav a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 15px;color:var(--muted);text-decoration:none;font-weight:800}.admin-nav a.active{border-color:var(--pink);color:#fff;background:#2a1420}.admin-card,.admin-login,.admin-callout,.admin-error,.admin-empty{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.admin-login{max-width:480px;margin:10vh auto}.admin-card-head,.admin-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.admin-section-head{margin-bottom:18px}.admin-section-head h1,.admin-card h2{margin:0 0 5px}.admin-section-head p,.admin-card p{margin:4px 0}.admin-eyebrow,.badge{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pink);font-weight:900}.badge{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}.muted{color:var(--muted)}.admin-callout{background:#11151a;border-color:#284a52}.admin-cms-toolbar{position:sticky;top:8px;z-index:4;background:#111116;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:0 10px 32px #0009}.admin-filters{display:grid;grid-template-columns:minmax(220px,1fr) minmax(150px,.35fr);gap:10px}.campaign-select{display:flex;align-items:center;gap:8px;grid-auto-flow:column;justify-content:start}.campaign-heading .campaign-select{margin-bottom:8px}.admin-warning{color:#ffe29a}.admin-status{min-height:1.4em}.admin-status.ok{color:var(--green)}.admin-status.error,.admin-error{color:var(--danger)}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.admin-grid .wide{grid-column:1/-1}.campaign-preview{display:flex;justify-content:center;background:var(--panel-2);border-radius:14px;padding:12px}.campaign-preview img{display:block;width:min(260px,100%);height:auto;border-radius:10px}label{display:grid;gap:5px;color:var(--muted);font-size:.82rem;font-weight:800}.user-facts,.report-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.user-facts div,.report-facts div,.admin-export{background:var(--panel-2);border-radius:12px;padding:11px;overflow-wrap:anywhere}.user-facts span,.report-facts span{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}.admin-toolbar{display:flex;gap:10px;align-items:end;margin-bottom:18px}.admin-toolbar label{flex:1}.report-route{display:flex;align-items:center;gap:8px;color:var(--muted)}.report-route strong{color:#fff}.admin-empty{text-align:center;color:var(--muted);padding:40px}.admin-export{margin-top:16px}.hidden{display:none!important}@media(max-width:760px){.admin-shell{padding:16px}.admin-header,.admin-section-head{align-items:flex-start;flex-direction:column}.admin-title{display:none}.user-facts,.report-facts,.admin-grid{grid-template-columns:1fr 1fr}.admin-toolbar{align-items:stretch;flex-direction:column}.admin-toolbar button{width:100%}}@media(max-width:430px){.user-facts,.report-facts,.admin-grid,.admin-filters{grid-template-columns:1fr}.admin-actions>*{width:100%}.admin-actions .campaign-select{width:auto}.admin-logo{width:165px}}
  </style>
  <style>@media(max-width:760px){.admin-cms-toolbar{position:static}}</style>
</head>
<body>
<main class="admin-shell">
  <header class="admin-header"><a href="/" aria-label="Nothing Sport home"><img class="admin-logo" src="/assets/brand/web/nothingsport-logo.png" alt="nothing SPORT"></a><span class="admin-title">Owner console</span><button id="signout" class="secondary hidden">Sign out</button></header>
  <nav id="adminNav" class="admin-nav hidden" aria-label="Owner console"><a href="/admin/users" data-tab="users">Users</a><a href="/admin/reports" data-tab="reports">Reports</a><a href="/admin/comms" data-tab="comms">Communications</a></nav>
  <section id="adminApp"><p class="muted">Loading owner console…</p></section>
</main>
<script src="/config/server-sync.js"></script>
<script src="/config/admin-comms-ui.js?v=198"></script>
<script>
(()=>{
  const app=document.getElementById("adminApp"),nav=document.getElementById("adminNav"),signout=document.getElementById("signout"),client=NOTHINGSPORTS_SERVER_SYNC.createClient();
  const esc=value=>String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);
  const date=value=>value?new Intl.DateTimeFormat("en-AU",{dateStyle:"medium",timeStyle:"short"}).format(new Date(value)):"—";
  const route=()=>location.pathname.includes("/reports")?"reports":location.pathname.includes("/comms")?"comms":"users";
  const name=identity=>identity?.handle?`${identity.displayName} (${identity.handle})`:identity?.displayName||"Public profile not set";
  function setChrome(active){nav.classList.remove("hidden");signout.classList.remove("hidden");nav.querySelectorAll("a").forEach(link=>link.classList.toggle("active",link.dataset.tab===active))}
  function login(message=""){
    nav.classList.add("hidden");signout.classList.add("hidden");app.innerHTML=`<section class="admin-login"><h1>Owner sign in</h1><p class="muted">Supabase verifies the account; only server-owned <code>app_metadata.role = admin</code> is accepted.</p><div class="admin-grid"><label class="wide">Email<input id="adminEmail" type="email" autocomplete="username"></label><label class="wide">Password<input id="adminPassword" type="password" autocomplete="current-password"></label><button id="adminSignin">Sign in</button></div><p class="admin-status error">${esc(message)}</p></section>`;
    app.querySelector("#adminSignin").addEventListener("click",async()=>{try{await client.signIn(app.querySelector("#adminEmail").value,app.querySelector("#adminPassword").value);await loadRoute()}catch(error){login(error.message)}});
  }
  async function userAction(subjectRef,action,label){
    if(!confirm(`${label}? This is an explicit account action and is written to the admin audit ledger.`))return;
    await client.adminUsersRequest({}, {subjectRef,action,confirm:true});await renderUsers();
  }
  function userCard(user){
    const card=document.createElement("article"),profile=user.publicProfile||{},pilot=user.pilot||{};card.className="admin-card";
    const profileMessage=profile.visibility==="missing"?"Approval does not create a public profile. This user must finish their display name and handle in Settings before contributing.":profile.visibility==="visible"?"Public profile ready.":`Public profile is ${profile.visibility}.`;
    card.innerHTML=`<div class="admin-card-head"><div><span class="admin-eyebrow">Confirmed account</span><h2>${esc(profile.displayName||user.email)}</h2><p class="muted">${esc(user.email)}${profile.handle?` · ${esc(profile.handle)}`:""}</p></div><span class="badge">${pilot.approved?"Pilot approved":"Not approved"}</span></div><div class="user-facts"><div><span>Profile</span>${esc(profile.visibility)}</div><div><span>Contributions</span>${pilot.suspended?"Suspended":"Active"}</div><div><span>Open reports</span>${user.openReportCount}</div><div><span>Last sign-in</span>${esc(date(user.lastSignInAt))}</div></div><p class="muted">${esc(profileMessage)}</p><div class="admin-actions"><button data-action="${pilot.approved?"revoke-approval":"approve"}">${pilot.approved?"Revoke approval":"Approve"}</button><button class="${pilot.suspended?"secondary":"danger"}" data-action="${pilot.suspended?"reinstate":"suspend"}">${pilot.suspended?"Reinstate contributions":"Suspend contributions"}</button>${profile.visibility==="visible"?'<button class="secondary" data-action="hide-profile">Hide profile</button>':profile.visibility==="hidden"?'<button class="secondary" data-action="restore-profile">Restore profile</button>':""}</div><p class="admin-status" role="status"></p>`;
    card.querySelectorAll("[data-action]").forEach(button=>button.addEventListener("click",async()=>{const status=card.querySelector(".admin-status");try{await userAction(user.subjectRef,button.dataset.action,button.textContent);status.className="admin-status ok";status.textContent="Updated."}catch(error){status.className="admin-status error";status.textContent=error.message}}));return card;
  }
  function earlyPanelCard(panel){
    const card=document.createElement("section"),active=Number(panel.activeRealContributors90d||0),threshold=Number(panel.retirementThreshold||10),eligible=Boolean(panel.eligibleToRetire),enabled=Boolean(panel.publicEnabled);
    card.className="admin-callout";
    const readiness=eligible?"Eligible to retire":`${Math.max(0,threshold-active)} more active genuine contributor${threshold-active===1?"":"s"} required`;
    const environment=panel.environmentMode==="public"?"The production kill switch permits the owner-controlled public state.":`The ${esc(panel.environmentMode||"off")} environment kill switch currently overrides this stored state.`;
    card.innerHTML=`<div class="admin-card-head"><div><span class="admin-eyebrow">Early panel</span><h2>Community rollout</h2><p class="muted">The milestone is product readiness, not statistical significance.</p></div><span class="badge">${enabled?"Public":"Retired"}</span></div><div class="user-facts"><div><span>Active genuine contributors</span>${active} / 10</div><div><span>90-day milestone</span>${esc(readiness)}</div><div><span>Environment</span>${esc(panel.environmentMode||"off")}</div><div><span>Effective state</span>${panel.effectivePublicEnabled?"Public":"Genuine-only"}</div></div><p class="muted">${environment}</p><div class="admin-actions"><button data-panel-action="${enabled?"retire-early-panel":"restore-early-panel"}" ${enabled&&!eligible?"disabled":""}>${enabled?"Retire public Early panel":"Restore Early panel"}</button></div><p class="admin-status" role="status"></p>`;
    const button=card.querySelector("[data-panel-action]");button?.addEventListener("click",async()=>{const label=button.textContent;if(!confirm(`${label}? This changes the public rollout state and is written to the admin audit ledger.`))return;const status=card.querySelector(".admin-status");try{await client.adminPanelRequest({action:button.dataset.panelAction,confirm:true});await renderUsers()}catch(error){status.className="admin-status error";status.textContent=error.message}});
    return card;
  }
  async function renderUsers(){
    setChrome("users");const search=new URLSearchParams(location.search).get("q")||"";app.innerHTML=`<div class="admin-section-head"><div><h1>Users</h1><p>Approval and a visible public profile are separate requirements.</p></div></div><div id="earlyPanelControl"><p class="muted">Loading Early panel status…</p></div><div class="admin-toolbar"><label>Search confirmed accounts<input id="userSearch" value="${esc(search)}" placeholder="Email, public name or handle"></label><button id="searchUsers">Search</button></div><div id="usersList"><p class="muted">Loading users…</p></div>`;
    const run=()=>{const q=app.querySelector("#userSearch").value.trim(),url=new URL(location.href);q?url.searchParams.set("q",q):url.searchParams.delete("q");history.replaceState({},"",url);renderUsers()};app.querySelector("#searchUsers").addEventListener("click",run);app.querySelector("#userSearch").addEventListener("keydown",event=>{if(event.key==="Enter")run()});
    const[data,panel]=await Promise.all([client.adminUsersRequest({q:search}),client.adminPanelRequest()]);app.querySelector("#earlyPanelControl").replaceChildren(earlyPanelCard(panel));const list=app.querySelector("#usersList");list.innerHTML="";if(!data.users.length){list.innerHTML='<div class="admin-empty">No confirmed accounts match that search.</div>';return}data.users.forEach(user=>list.appendChild(userCard(user)));
  }
  async function reportAction(report,action,label){
    if(!confirm(`${label}? Report review and account controls stay independent.`))return;
    const resolution=["mark-reviewed","dismiss","mark-actioned"].includes(action)?prompt("Resolution note (optional):","")||"":"";
    await client.adminReportsRequest({}, {reportId:report.reportId,action,resolution,confirm:true});await renderReports();
  }
  function reportCard(report){
    const card=document.createElement("article"),state=report.targetModeration||{};card.className="admin-card";card.innerHTML=`<div class="admin-card-head"><div><span class="admin-eyebrow">${esc(report.status)} · ${esc(report.reason)}</span><h2>${esc(name(report.target))}</h2><p class="report-route"><span>Reported by</span><strong>${esc(name(report.reporter))}</strong></p></div><span class="badge">${esc(date(report.createdAt))}</span></div><div class="report-facts"><div><span>Target profile</span>${esc(state.profileVisibility)}</div><div><span>Pilot</span>${state.pilotApproved?"Approved":"Not approved"}</div><div><span>Contributions</span>${state.contributionsSuspended?"Suspended":"Active"}</div><div><span>Resolution</span>${esc(report.resolution||"—")}</div></div><div class="admin-actions"><button data-action="mark-reviewed">Mark reviewed</button><button class="secondary" data-action="dismiss">Dismiss</button><button class="secondary" data-action="mark-actioned">Mark actioned</button>${state.profileVisibility==="visible"?'<button class="secondary" data-action="hide-profile">Hide profile</button>':state.profileVisibility==="hidden"?'<button class="secondary" data-action="restore-profile">Restore profile</button>':""}<button class="${state.contributionsSuspended?"secondary":"danger"}" data-action="${state.contributionsSuspended?"reinstate-contributions":"suspend-contributions"}">${state.contributionsSuspended?"Reinstate contributions":"Suspend contributions"}</button></div><p class="muted">Reviewing or actioning this report does not automatically hide, suspend or revoke the target account. No accusation or reporter email is sent to the target.</p><p class="admin-status" role="status"></p>`;
    card.querySelectorAll("[data-action]").forEach(button=>button.addEventListener("click",async()=>{const status=card.querySelector(".admin-status");try{await reportAction(report,button.dataset.action,button.textContent);status.className="admin-status ok";status.textContent="Updated."}catch(error){status.className="admin-status error";status.textContent=error.message}}));return card;
  }
  async function renderReports(){
    setChrome("reports");const status=new URLSearchParams(location.search).get("status")||"open";app.innerHTML=`<div class="admin-section-head"><div><h1>Reports</h1><p>Public identities only. Reporter emails and raw Auth IDs never enter this view.</p></div></div><div class="admin-toolbar"><label>Status<select id="reportStatus"><option value="">All</option>${["open","reviewed","dismissed","actioned"].map(value=>`<option value="${value}" ${status===value?"selected":""}>${value}</option>`).join("")}</select></label><button id="refreshReports">Refresh</button></div><div id="reportsList"><p class="muted">Loading reports…</p></div>`;
    const apply=()=>{const value=app.querySelector("#reportStatus").value,url=new URL(location.href);value?url.searchParams.set("status",value):url.searchParams.delete("status");history.replaceState({},"",url);renderReports()};app.querySelector("#reportStatus").addEventListener("change",apply);app.querySelector("#refreshReports").addEventListener("click",apply);
    const data=await client.adminReportsRequest({status}),list=app.querySelector("#reportsList");list.innerHTML="";if(!data.reports.length){list.innerHTML='<div class="admin-empty">No reports match this status.</div>';return}data.reports.forEach(report=>list.appendChild(reportCard(report)));
  }
  async function loadRoute(){
    try{const active=route();if(active==="users")await renderUsers();else if(active==="reports")await renderReports();else{setChrome("comms");await NOTHINGSPORTS_ADMIN_COMMS_UI.mount(app,client)}}catch(error){if(error.status===401||!client.getSession())login(error.message);else{setChrome(route());app.innerHTML=`<div class="admin-error"><h1>Owner console unavailable</h1><p>${esc(error.message)}</p><button id="retryAdmin">Retry</button></div>`;app.querySelector("#retryAdmin").addEventListener("click",loadRoute)}}
  }
  nav.querySelectorAll("a").forEach(link=>link.addEventListener("click",event=>{event.preventDefault();history.pushState({},"",link.href);loadRoute()}));window.addEventListener("popstate",loadRoute);signout.addEventListener("click",async()=>{await client.signOut();login()});client.getSession()?loadRoute():login();
})();
</script>
</body>
</html>
