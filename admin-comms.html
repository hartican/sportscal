<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mailchimp campaign workbench · Nothing Sport</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#17171b;--line:#34343b;--muted:#aaaab2;--pink:#ff2d8d;--lime:#b6f455;--amber:#ffc857;--danger:#ff9494;font:15px/1.45 Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fafafa}.shell{width:min(1180px,100%);margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.logo{width:190px}.panel,.campaign{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}.login{max-width:480px;margin:10vh auto}.fields,.copy,.export-grid{display:grid;gap:12px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#0d0d10;color:#fff}textarea{resize:vertical}button,.button-link{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--pink);color:#09090b;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.secondary,.button-link.secondary{background:#292930;color:#fff;border:1px solid #44444d}button:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.meta div,.handoff{background:#101013;border-radius:12px;padding:12px}.meta span,.eyebrow{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}.preview{display:grid;grid-template-columns:280px 1fr;gap:20px}.preview>div>img{width:100%;border-radius:12px}.state{font-weight:900;text-transform:uppercase;letter-spacing:.08em}.state.exported{color:var(--lime)}.state.urgent,.state.stale{color:var(--amber)}.state.ready{color:var(--pink)}.state.watching{color:var(--muted)}.notice{color:var(--muted)}.error{color:var(--danger)}.success{color:var(--lime)}.warning{border:1px solid #745d20;background:#241e0e;color:#ffe29a;border-radius:12px;padding:12px}.export-tools{border-top:1px solid var(--line);margin-top:10px;padding-top:16px}.export-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0}.export-grid div{background:#0d0d10;border-radius:12px;padding:12px;overflow-wrap:anywhere}.export-grid strong{display:block;margin-bottom:4px}.empty{text-align:center;padding:42px 20px}.steps{margin:10px 0 0;padding-left:22px;color:var(--muted)}a{color:#ff79b6}@media(max-width:760px){.shell{padding:18px}.meta,.export-grid{grid-template-columns:1fr 1fr}.preview{grid-template-columns:1fr}.preview>div>img{max-width:340px}header{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.meta,.export-grid{grid-template-columns:1fr}.toolbar>*{width:100%}}
  </style>
</head>
<body>
<main class="shell">
  <header><a href="/"><img class="logo" src="/assets/brand/web/nothingsport-logo-night.png" alt="Nothing Sport"></a><strong>Mailchimp campaign workbench</strong></header>
  <section id="app" class="panel"><p>Loading…</p></section>
</main>
<script src="/config/server-sync.js"></script>
<script>
(()=>{
  const app=document.getElementById("app"),client=NOTHINGSPORTS_SERVER_SYNC.createClient();
  const esc=value=>String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);
  const splitParagraphs=value=>String(value||"").split(/\n\s*\n/).map(item=>item.trim()).filter(Boolean);
  const sydneyLine=value=>[value?.date,value?.time,value?.timezone].filter(Boolean).join(" · ");
  function login(message=""){
    app.className="panel login";
    app.innerHTML=`<h1>Admin sign in</h1><p class="notice">Supabase verifies the account and the server requires the protected admin role.</p><div class="fields"><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin">Sign in</button><div class="error">${esc(message)}</div></div>`;
    document.getElementById("signin").onclick=async()=>{try{await client.signIn(document.getElementById("email").value,document.getElementById("password").value);await load()}catch(error){login(error.message)}};
  }
  async function copyText(value,status,label){
    try{
      if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(String(value||""));
      else{const area=document.createElement("textarea");area.value=String(value||"");area.style.position="fixed";area.style.opacity="0";document.body.append(area);area.select();document.execCommand("copy");area.remove()}
      status.className="success";status.textContent=`${label} copied.`;
    }catch(error){status.className="error";status.textContent=`Could not copy ${label.toLowerCase()}: ${error.message}`}
  }
  function handoffText(pack){
    return [`Subject: ${pack.subject}`,`Preview text: ${pack.previewText}`,`Suggested send: ${sydneyLine(pack.suggestedSendAt?.sydney)} (${pack.suggestedSendAt?.utc||""})`,`Headline: ${pack.headline}`,`Body:\n${(pack.bodyParagraphs||[]).join("\n\n")}`,pack.timingLine?`Timing: ${pack.timingLine}`:"",pack.broadcastLine?`Broadcast: ${pack.broadcastLine}`:"",`Primary CTA: ${pack.primaryCta?.label||""}\n${pack.primaryCta?.url||""}`,pack.secondaryCta?`Secondary CTA: ${pack.secondaryCta.label}\n${pack.secondaryCta.url}`:"",`Image: ${pack.image?.url||""}`,`Alt text: ${pack.image?.altText||""}`,`Source: ${pack.source?.name||""}\n${pack.source?.url||""}`].filter(Boolean).join("\n\n");
  }
  function displayState(campaign){
    if(campaign.export_stale)return {label:"Source changed since export",className:"stale"};
    if(campaign.state==="exported")return {label:"Exported",className:"exported"};
    if(campaign.late)return {label:"Urgent",className:"urgent"};
    if(campaign.state==="watching")return {label:"Watching",className:"watching"};
    return {label:"Ready",className:"ready"};
  }
  function renderExportTools(campaign,status){
    const pack=campaign.export_snapshot;
    if(campaign.state!=="exported"||campaign.export_stale||!pack)return "";
    const download=pack.image?.path||pack.image?.url||"";
    return `<section class="export-tools"><div class="eyebrow">Frozen Mailchimp export · ${esc(pack.exportedAt)}</div><div class="export-grid"><div><strong>Subject</strong>${esc(pack.subject)}</div><div><strong>Preview text</strong>${esc(pack.previewText)}</div><div><strong>Suggested send</strong>${esc(sydneyLine(pack.suggestedSendAt?.sydney))}</div><div><strong>Image alt text</strong>${esc(pack.image?.altText)}</div></div><div class="toolbar"><button class="secondary" data-copy="subject">Copy subject</button><button class="secondary" data-copy="preview">Copy preview</button><button class="secondary" data-copy="headline">Copy headline</button><button class="secondary" data-copy="body">Copy body</button><button class="secondary" data-copy="link">Copy fixture link</button><button class="secondary" data-copy="alt">Copy alt text</button><button data-copy="complete">Copy complete handoff</button>${download?`<a class="button-link secondary" href="${esc(download)}" download="${esc(campaign.campaign_id)}-mailchimp.jpg">Download image</a>`:""}<a class="button-link secondary" href="${esc(pack.primaryCta?.url)}" target="_blank" rel="noopener">Open fixture</a></div></section>`;
  }
  function wireExportTools(card,campaign,status){
    const pack=campaign.export_snapshot;
    if(campaign.state!=="exported"||campaign.export_stale||!pack)return;
    const values={subject:pack.subject,preview:pack.previewText,headline:pack.headline,body:(pack.bodyParagraphs||[]).join("\n\n"),link:pack.primaryCta?.url,alt:pack.image?.altText,complete:handoffText(pack)};
    card.querySelectorAll("[data-copy]").forEach(button=>button.onclick=()=>copyText(values[button.dataset.copy],status,button.textContent.replace(/^Copy /,"")));
  }
  function render(data){
    app.className="";
    app.innerHTML=`<section class="panel"><div class="toolbar"><button id="sync">Sync deployed candidates</button><button class="secondary" id="signout">Sign out</button></div><h1>Mailchimp campaign workbench</h1><p>Nothing Sport prepares the campaign; Mailchimp sends it.</p><p class="notice">Review the evidence and suggested copy here, freeze an export snapshot, then make final edits, select the consented audience, test and schedule in Mailchimp. No email or social connector runs from this page.</p><div class="handoff"><strong>Manual handoff</strong><ol class="steps"><li>Create a regular email in Mailchimp and select the audience.</li><li>Copy the subject, preview text and body; upload the supplied image and alt text.</li><li>Check the fixture link, send a test, then schedule at the suggested Sydney time.</li></ol></div></section><section id="campaigns"></section>`;
    document.getElementById("sync").onclick=async()=>{await client.commsRequest({action:"sync-candidates"});await load()};
    document.getElementById("signout").onclick=async()=>{await client.signOut();login()};
    const list=document.getElementById("campaigns");
    if(!data.campaigns.length){list.innerHTML='<section class="panel empty"><h2>No marquee candidates</h2><p class="notice">Sync after the canonical card refresh creates eligible 5/5-stakes candidates.</p></section>';return}
    data.campaigns.forEach(campaign=>{
      const candidate=campaign.candidate||{},draft=campaign.draft_copy||candidate.drafts||{},email=draft.email||{},instagram=draft.instagram||{},locked=campaign.state==="exported"||Boolean(campaign.approved_at),state=displayState(campaign),card=document.createElement("article"),statusId=`status-${campaign.campaign_id}`;
      card.className="campaign";
      card.innerHTML=`<div class="state ${state.className}">${esc(state.label)}</div><h2>${esc(candidate.material?.title||email.headline||"Campaign")}</h2>${campaign.export_stale?'<p class="warning">The canonical fixture changed after the last export. Update or replace the Mailchimp draft, then prepare a fresh export from this revision.</p>':""}<div class="meta"><div><span>Sydney start</span>${esc(candidate.drafts?.when?.date||draft.when?.date)}<br>${esc(candidate.drafts?.when?.time||draft.when?.time)} ${esc(candidate.drafts?.when?.timezone||draft.when?.timezone)}</div><div><span>Suggested send</span>${esc(sydneyLine(email.suggestedSendAt?.sydney))}</div><div><span>Revision</span>${esc(campaign.campaign_revision)}<br>${esc(String(campaign.content_hash||"").slice(0,12))}</div><div><span>Source freshness</span>${esc(candidate.source?.checkedAt)}<br><a href="${esc(candidate.source?.url)}" target="_blank" rel="noopener">${esc(candidate.source?.name)}</a></div></div><div class="preview"><div><img src="${esc(instagram.image?.path||email.image?.path)}" alt="${esc(instagram.altText||email.image?.altText)}"><p class="notice">${esc(instagram.altText||email.image?.altText)}</p></div><div class="copy"><label>Instagram caption<textarea data-field="caption" rows="5" ${locked?"disabled":""}>${esc(instagram.caption)}</textarea></label><label>Email subject<input data-field="subject" value="${esc(email.subject)}" ${locked?"disabled":""}></label><label>Preview text<input data-field="preheader" value="${esc(email.preheader)}" ${locked?"disabled":""}></label><label>Email headline<input data-field="headline" value="${esc(email.headline)}" ${locked?"disabled":""}></label><label>Email body<textarea data-field="body" rows="8" ${locked?"disabled":""}>${esc((email.bodyParagraphs||[]).join("\n\n"))}</textarea></label><label>Primary CTA label<input data-field="primary-label" value="${esc(email.primaryCta?.label||"Open the fixture")}" ${locked?"disabled":""}></label><p class="notice">${esc(email.timingLine)}${email.broadcastLine?`<br>${esc(email.broadcastLine)}`:""}</p><div class="toolbar">${locked?`<button data-action="reopen">Reopen as new revision</button>`:`<button class="secondary" data-action="save">Save draft</button><button data-action="export">Prepare Mailchimp export</button>`}<a class="button-link secondary" href="${esc(candidate.participation?.fixtureUrl)}" target="_blank" rel="noopener">Open fixture</a></div><div id="${esc(statusId)}" class="notice"></div>${renderExportTools(campaign,statusId)}</div></div>`;
      const status=card.querySelector(`#${statusId}`);
      const save=card.querySelector('[data-action="save"]');
      if(save)save.onclick=async()=>{const next=structuredClone(draft);next.instagram=next.instagram||{};next.email=next.email||{};next.instagram.caption=card.querySelector('[data-field="caption"]').value;next.email.subject=card.querySelector('[data-field="subject"]').value;next.email.preheader=card.querySelector('[data-field="preheader"]').value;next.email.headline=card.querySelector('[data-field="headline"]').value;next.email.bodyParagraphs=splitParagraphs(card.querySelector('[data-field="body"]').value);next.email.primaryCta={...(next.email.primaryCta||{}),label:card.querySelector('[data-field="primary-label"]').value};try{await client.commsRequest({action:"edit",campaignId:campaign.campaign_id,draftCopy:next});await load()}catch(error){status.className="error";status.textContent=error.message}};
      const exportButton=card.querySelector('[data-action="export"]');
      if(exportButton)exportButton.onclick=async()=>{try{await client.commsRequest({action:"export-mailchimp",campaignId:campaign.campaign_id});await load()}catch(error){status.className="error";status.textContent=error.message}};
      const reopen=card.querySelector('[data-action="reopen"]');
      if(reopen)reopen.onclick=async()=>{try{await client.commsRequest({action:"reopen-export",campaignId:campaign.campaign_id});await load()}catch(error){status.className="error";status.textContent=error.message}};
      wireExportTools(card,campaign,status);
      list.append(card);
    });
  }
  async function load(){
    try{render(await client.commsRequest())}
    catch(error){if(error.status===401||!client.getSession())login(error.message);else{app.className="panel";app.innerHTML=`<h1>Workbench unavailable</h1><p class="error">${esc(error.message)}</p><button id="retry">Retry</button>`;document.getElementById("retry").onclick=load}}
  }
  client.getSession()?load():login();
})();
</script>
</body>
</html>
