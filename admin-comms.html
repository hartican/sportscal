<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Marquee communications · Nothing Sport</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#17171b;--line:#34343b;--muted:#aaaab2;--pink:#ff2d8d;font:15px/1.45 Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fafafa}.shell{width:min(1180px,100%);margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.logo{width:190px}.panel,.campaign{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}.login{max-width:480px;margin:10vh auto}.fields{display:grid;gap:12px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#0d0d10;color:#fff}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--pink);color:#09090b;cursor:pointer}button.secondary{background:#292930;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.meta div{background:#101013;border-radius:12px;padding:12px}.meta span{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase}.preview{display:grid;grid-template-columns:260px 1fr;gap:20px}.preview img{width:100%;border-radius:12px}.copy{display:grid;gap:10px}.state{color:var(--pink);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.notice{color:var(--muted)}.error{color:#ff9494}@media(max-width:760px){.meta{grid-template-columns:1fr 1fr}.preview{grid-template-columns:1fr}.preview img{max-width:320px}}
  </style>
</head>
<body><main class="shell"><header><a href="/"><img class="logo" src="/assets/brand/web/nothingsport-logo-night.png" alt="Nothing Sport"></a><strong>Private communications queue</strong></header><section id="app" class="panel"><p>Loading…</p></section></main>
<script src="/config/server-sync.js"></script>
<script>
(()=>{const app=document.getElementById("app"),client=NOTHINGSPORTS_SERVER_SYNC.createClient();const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function login(message=""){app.className="panel login";app.innerHTML=`<h1>Admin sign in</h1><p class="notice">Supabase verifies the account and the server requires the protected admin role.</p><div class="fields"><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin">Sign in</button><div class="error">${esc(message)}</div></div>`;document.getElementById("signin").onclick=async()=>{try{await client.signIn(document.getElementById("email").value,document.getElementById("password").value);await load()}catch(e){login(e.message)}}}
async function command(payload){await client.commsRequest(payload);return load()}
function render(data){app.className="";app.innerHTML=`<section class="panel"><div class="toolbar"><button id="sync">Sync deployed candidates</button><button class="secondary" id="signout">Sign out</button></div><p class="notice">${data.campaigns.length} campaigns · ${data.audienceCount} active consented email recipients. Instagram and email stay blocked until their exact connectors and operator details are configured.</p></section><section id="campaigns"></section>`;document.getElementById("sync").onclick=()=>command({action:"sync-candidates"});document.getElementById("signout").onclick=async()=>{await client.signOut();login()};const list=document.getElementById("campaigns");data.campaigns.forEach(c=>{const x=c.candidate,locked=Boolean(c.approved_at),card=document.createElement("article");card.className="campaign";card.innerHTML=`<div class="state">${esc(c.state)}${c.late?" · LATE":""}</div><h2>${esc(x.material.title)}</h2><div class="meta"><div><span>Sydney start</span>${esc(x.drafts.when.date)}<br>${esc(x.drafts.when.time)} ${esc(x.drafts.when.timezone)}</div><div><span>Expected finish</span>${esc(x.drafts.finish.time)} ${esc(x.drafts.finish.timezone)}</div><div><span>Revision</span>${c.campaign_revision}<br>${esc(c.content_hash.slice(0,12))}</div><div><span>Source freshness</span>${esc(x.source.checkedAt)}<br><a href="${esc(x.source.url)}" target="_blank" rel="noopener">${esc(x.source.name)}</a></div></div><div class="preview"><img src="${esc(x.drafts.instagram.image.path)}" alt="${esc(x.drafts.instagram.altText)}"><div class="copy"><label>Instagram caption<textarea data-field="caption" rows="6" ${locked?"disabled":""}>${esc(c.draft_copy.instagram.caption)}</textarea></label><label>Email subject<input data-field="subject" value="${esc(c.draft_copy.email.subject)}" ${locked?"disabled":""}></label><label>Email preheader<input data-field="preheader" value="${esc(c.draft_copy.email.preheader)}" ${locked?"disabled":""}></label><p><a href="${esc(x.participation.fixtureUrl)}" target="_blank" rel="noopener">Preview fixture hub</a></p><div class="toolbar"><button data-action="save" ${locked?"disabled":""}>Save draft</button><button data-action="approve" ${locked?"disabled":""}>Approve and freeze</button>${c.late&&locked?'<button data-action="send">Send now (confirm twice)</button>':""}</div><div class="notice" data-status></div></div></div>`;const status=card.querySelector("[data-status]");card.querySelector('[data-action="save"]').onclick=async()=>{const draft=structuredClone(c.draft_copy);draft.instagram.caption=card.querySelector('[data-field="caption"]').value;draft.email.subject=card.querySelector('[data-field="subject"]').value;draft.email.preheader=card.querySelector('[data-field="preheader"]').value;try{await command({action:"edit",campaignId:c.campaign_id,draftCopy:draft})}catch(e){status.textContent=e.message}};card.querySelector('[data-action="approve"]').onclick=async()=>{if(!confirm("Approve and freeze this exact campaign revision?"))return;try{await command({action:"approve",campaignId:c.campaign_id})}catch(e){status.textContent=e.message}};const send=card.querySelector('[data-action="send"]');if(send)send.onclick=async()=>{if(!confirm("This campaign was discovered late. Continue to the final confirmation?"))return;const phrase=prompt("Type SEND NOW to confirm. Channels still fail closed if unavailable.");try{await command({action:"send-now",campaignId:c.campaign_id,confirmation:phrase})}catch(e){status.textContent=e.message}};list.append(card)})}
async function load(){try{render(await client.commsRequest())}catch(e){if(e.status===401||!client.getSession())login(e.message);else app.innerHTML=`<section class="panel"><h1>Queue unavailable</h1><p class="error">${esc(e.message)}</p><button id="retry">Retry</button></section>`,document.getElementById("retry").onclick=load}}
client.getSession()?load():login();})();
</script></body></html>
