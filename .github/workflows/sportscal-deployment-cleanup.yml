name: Sportscal deployment cleanup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: sportscal-production-and-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global vercel@59.1.4
      - run: node scripts/hobby-deployment-cleanup.js --apply --report "${{ runner.temp }}/cleanup.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-cleanup
          path: ${{ runner.temp }}/cleanup.json
          retention-days: 14
