name: Quick results refresh

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run both possible UTC hours, then let the Sydney
    # guard below admit only 09:00, 15:00 and 21:00 across AEST/AEDT.
    - cron: "0 4,5,10,11,22,23 * * *"

permissions:
  contents: write

concurrency:
  group: canonical-card-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Select tournament or baseline cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/quick-results-cadence.js --github-output "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install project and deployment dependencies
        if: steps.cadence.outputs.run == 'true'
        run: |
          npm ci
          npm install --global vercel@59.1.4

      - name: Link the immutable deployment target
        if: steps.cadence.outputs.run == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          node -e 'const fs=require("node:fs"); fs.writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}, null, 2) + "\n", {mode:0o600})'

      - name: Configure release author
        if: steps.cadence.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh, validate, publish and deploy
        if: steps.cadence.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_COMMIT_MESSAGE: Lightweight results refresh
          QUICK_RESULTS: "1"
        run: bash scripts/update-sportscal-cards-and-release.sh
