name: Installed app upgrade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - app-version.json
      - index.html
      - service-worker.js
      - assets/**
      - config/**
      - styles/**
      - scripts/validate-installed-pwa-upgrade-browser.js
      - scripts/validate-account-sync-recovery-browser.js
      - scripts/lib/installed-offline-diagnostic.js
      - scripts/run-installed-offline-diagnostic.js
      - scripts/validate-installed-offline-diagnostic.js
      - .github/workflows/installed-upgrade-tests.yml

permissions:
  contents: read

concurrency:
  group: installed-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  installed-upgrade:
    # TEMPORARY isolated diagnostic PR only; never merge this mode into main.
    name: ${{ contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') && 'OFFLINE DIAGNOSTIC - NOT RELEASE ACCEPTANCE' || 'installed-upgrade' }} (${{ matrix.browser }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') && '["webkit"]' || '["chromium","webkit"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - name: Record exact source and runtime
        env:
          BASELINE_SHA: ${{ contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') && '6aa5979ab440b38765fe1038ab3b1203e354fe40' || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ns-upgrade-proof"
          node <<'JS' > "$RUNNER_TEMP/ns-upgrade-proof/context.json"
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          console.log(JSON.stringify({testedSha:git('rev-parse','HEAD'),testedTree:git('rev-parse','HEAD^{tree}'),headSha:process.env.PR_HEAD_SHA,baselineSha:process.env.BASELINE_SHA,node:process.version,zlib:process.versions.zlib,playwright:'1.62.1',platform:process.platform,arch:process.arch,limits:'Existing unchanged installed upgrade and account recovery harnesses on Linux; account transport is mocked loopback. Not hosted or physical iPhone acceptance. No production credentials or deployment.'},null,2));
          JS
      - name: Use the official Ubuntu archive for test dependencies
        run: |
          set -o pipefail
          sudo python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/apt-mirror.log"
          from pathlib import Path
          import json
          root = Path('/etc/apt')
          files = [*root.glob('*.list'), *root.glob('apt-mirrors*.txt'),
                   *(root / 'sources.list.d').glob('*.list'), *(root / 'sources.list.d').glob('*.sources')]
          changed = []
          has_archive = False
          for file in files:
              if not file.is_file() or file.is_symlink():
                  continue
              before = file.read_text()
              after = before.replace('azure.archive.ubuntu.com', 'archive.ubuntu.com')
              has_archive = has_archive or 'archive.ubuntu.com' in after
              if after != before:
                  file.write_text(after)
                  changed.append(str(file))
          assert has_archive, 'Expected official Ubuntu package archive configuration'
          print(json.dumps({'changedFiles': changed, 'archive': 'archive.ubuntu.com', 'packageSignatureValidation': 'unchanged'}))
          PY
      - name: Install isolated test dependencies
        run: |
          set -o pipefail
          {
            npm ci
            npm install --prefix "$RUNNER_TEMP/ns-playwright" --no-save --package-lock=false playwright@1.62.1
            node "$RUNNER_TEMP/ns-playwright/node_modules/playwright/cli.js" install --with-deps "${{ matrix.browser }}"
          } 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/install.log"
      - name: Verify installed upgrade and offline restart
        env:
          PWA_BASELINE_SHA: ${{ contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') && '6aa5979ab440b38765fe1038ab3b1203e354fe40' || github.event.pull_request.base.sha }}
          PWA_BROWSER: ${{ matrix.browser }}
          PWA_OFFLINE_DIAGNOSTIC: ${{ contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') && '1' || '0' }}
          PWA_OFFLINE_DIAGNOSTIC_DIR: ${{ runner.temp }}/ns-upgrade-proof/offline-boundary
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ns-playwright/node_modules/playwright"
          set -o pipefail
          if [ "$PWA_OFFLINE_DIAGNOSTIC" = "1" ]; then
            node scripts/validate-installed-offline-diagnostic.js
            node scripts/run-installed-offline-diagnostic.js
          else
            node scripts/validate-installed-pwa-upgrade-browser.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/browser.log"
          fi
      - name: Verify account recovery and copied diagnostics
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') }}
        env:
          ACCOUNT_RECOVERY_BROWSER: ${{ matrix.browser }}
          ACCOUNT_RECOVERY_CASE: all
          QA_BROWSER_CHANNEL: chromium
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ns-playwright/node_modules/playwright"
          set -o pipefail
          node scripts/validate-account-sync-recovery-browser.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/account-recovery.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ contains(github.event.pull_request.labels.*.name, 'pwa-offline-diagnostic') && 'OFFLINE-DIAGNOSTIC-NOT-ACCEPTANCE' || 'installed-upgrade' }}-${{ github.event.pull_request.head.sha }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/ns-upgrade-proof
          retention-days: 1
