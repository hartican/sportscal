name: Installed app upgrade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - app-version.json
      - index.html
      - service-worker.js
      - assets/**
      - config/**
      - styles/**
      - scripts/validate-installed-pwa-upgrade-browser.js
      - scripts/validate-peach-redesign-browser.js
      - scripts/validate-account-sync-recovery-browser.js
      - scripts/lib/account-sign-in-action-trace.js
      - scripts/validate-account-sign-in-action-trace.js
      - scripts/validate-new-user-journey.js
      - scripts/validate-server-persistence.js
      - scripts/lib/signup-setup-tests.js
      - scripts/lib/user-state-account-scope-tests.js
      - scripts/lib/user-state-optional-view-tests.js
      - scripts/validate-cross-device-sync.js
      - scripts/validate-empty-startup-meta.js
      - scripts/lib/installed-test-network.js
      - scripts/validate-installed-test-network.js
      - .github/installed-production-baseline.json
      - scripts/resolve-installed-production-baseline.js
      - scripts/validate-installed-production-baseline.js
      - scripts/lib/installed-navigation-observation.js
      - scripts/validate-installed-navigation-observation.js
      - scripts/validate-installed-offline-emulation-browser.js
      - scripts/validate-diamonds-retained-browser.js
      - scripts/validate-diamonds-retained-schedule.js
      - scripts/validate-notification-landing.js
      - scripts/validate-all-sports-offline-browser.js
      - scripts/lib/all-sports-offline-errors.js
      - scripts/validate-all-sports-offline-errors.js
      - scripts/fixtures/all-sports-offline-webkit-164-first-use.json
      - .github/workflows/installed-upgrade-tests.yml
      - scripts/app-shell-test-utils.js
      - scripts/validate-athletes.js
      - scripts/validate-code-inspector-ui.js
      - scripts/validate-follow-first.js
      - scripts/validate-major-events.js
      - scripts/validate-all-sports-card-fallback.js
      - scripts/validate-card-dismissal-learning.js
      - scripts/validate-shared-chat-ui.js
      - api/feed.js
      - lib/live-fixtures.js
      - lib/live-fixture-handler.js
      - lib/fixture-source-groups.js
      - lib/fixture-source-groups-v2.js
      - lib/calendar-handler.js
      - scripts/lib/global-app-adapter-qualification.js
      - scripts/verify-global-app-adapter.js
      - scripts/validate-hobby-feed-cache.js
      - scripts/validate-calendar-api.js
      - scripts/validate-production-sql-batches.js
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: installed-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixture-activation:
    name: Fixture activation / remaining three checks
    if: github.event.pull_request.draft == false || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/source-qualification-') && (github.event.pull_request.body == 'NS_CI_SOURCE_PHASE=source-qualification-v1' || github.event.pull_request.body == 'NS_CI_SOURCE_PHASE=canonical-producer-v1'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - name: Record exact source and runtime in job log
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node <<'JS'
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          console.log(JSON.stringify({testedSha:git('rev-parse','HEAD'),testedTree:git('rev-parse','HEAD^{tree}'),headSha:process.env.PR_HEAD_SHA,baseSha:process.env.PR_BASE_SHA,eventSha:process.env.GITHUB_SHA,node:process.version,platform:process.platform,arch:process.arch,limits:'Three existing source/mock activation checks, one bounded new-user journey unit and one bounded signup/setup compatibility check. Temporary bounded canonical artifact production requires a separate explicit same-repository draft producer phase after those checks; source-only and ready-for-review paths do not build. Not production SQL, hosted wire or physical iPhone acceptance.'},null,2));
          JS
      - name: Verify new-user journey source controls
        run: timeout --signal=TERM --kill-after=5s 120s node scripts/validate-new-user-journey.js
      - name: Install existing locked dependencies
        run: npm ci
      - name: Verify signup/setup compatibility
        run: timeout --signal=TERM --kill-after=5s 120s node scripts/validate-server-persistence.js
      - name: Verify actual exported Feed activation
        timeout-minutes: 2
        run: node scripts/validate-hobby-feed-cache.js
      - name: Verify subscription calendar activation
        timeout-minutes: 2
        run: node scripts/validate-calendar-api.js
      - name: Verify guarded production workflow contract
        timeout-minutes: 2
        run: node scripts/validate-production-sql-batches.js
      # Temporary packaging overlay: source qualification and artifacts are not release acceptance.
      - name: Produce bounded canonical afterimages
        id: canonical_producer
