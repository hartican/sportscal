          const outputs=fs.realpathSync(process.env.GITHUB_OUTPUT);assert(!inside(root,outputs));textValue(binding.path,'Binding output');
          fs.appendFileSync(outputs,'bindingPath='+binding.path+'\nworkPath='+work+'\n',{encoding:'utf8'});
          console.log(JSON.stringify(context));
          function parseCaptureEntries(bytes){
           const value=utf8Text(bytes);assert(value.endsWith('\0'));const records=value.slice(0,-1).split('\0');assert(records.length>0&&records.length<=E610_LIMITS.source);
           const names=new Set();return records.map(record=>{const m=/^(100644|100755|120000) blob ([0-9a-f]{40})\t([\s\S]+)$/.exec(record);assert(m,'Supported complete source entry');relativePath(m[3]);assert(!names.has(m[3]));names.add(m[3]);return {path:m[3],mode:m[1],type:'blob',gitBlob:m[2]};});
          }
          NS_PRIMARY_CAPTURE_INPUT
      - name: Capture exactly three installed primary bodies
        id: primary_baseline_capture
        if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/baseline-capture-')
        timeout-minutes: 2
        env:
          NS_PRIMARY_BASELINE_BINDING: ${{ steps.primary_baseline_input.outputs.bindingPath }}
          NS_PRIMARY_CAPTURE_WORK: ${{ steps.primary_baseline_input.outputs.workPath }}
        run: |
          set -Eeuo pipefail
          umask 077
          capture_status=0
          timeout --signal=TERM --kill-after=5s 65s node scripts/verify-production-release.js --capture-installed-primary-baseline > "$NS_PRIMARY_CAPTURE_WORK/capture-report.raw.json" 2> "$NS_PRIMARY_CAPTURE_WORK/capture.stderr" || capture_status=$?
          head -c 65536 "$NS_PRIMARY_CAPTURE_WORK/capture.stderr" > "$NS_PRIMARY_CAPTURE_WORK/capture.stderr.prefix.txt"
          if test "$(wc -c < "$NS_PRIMARY_CAPTURE_WORK/capture-report.raw.json")" -gt 16384; then
            head -c 16384 "$NS_PRIMARY_CAPTURE_WORK/capture-report.raw.json" > "$NS_PRIMARY_CAPTURE_WORK/capture-report.failed.prefix.txt"
            printf '%s\n' '{"schemaVersion":"primary-baseline-capture-failure.v1","status":"FAILED_OVERSIZED_REPORT","captureProofAccepted":false,"prefixIsDiagnosticOnly":true}' > "$NS_PRIMARY_CAPTURE_WORK/capture-failure.json"
            echo 'Capture report exceeds reviewed bound; retained prefix is failure-only diagnostic, not capture proof.' >&2
            exit 1
          fi
          mv "$NS_PRIMARY_CAPTURE_WORK/capture-report.raw.json" "$NS_PRIMARY_CAPTURE_WORK/capture-report.json"
          cat "$NS_PRIMARY_CAPTURE_WORK/capture-report.json"
