          console.log(JSON.stringify(context));
          function parseCaptureEntries(bytes){
           const value=utf8Text(bytes);assert(value.endsWith('\0'));const records=value.slice(0,-1).split('\0');assert(records.length>0&&records.length<=E610_LIMITS.source);
           const names=new Set();return records.map(record=>{const m=/^(100644|100755|120000) blob ([0-9a-f]{40})\t([\s\S]+)$/.exec(record);assert(m,'Supported complete source entry');relativePath(m[3]);assert(!names.has(m[3]));names.add(m[3]);return {path:m[3],mode:m[1],type:'blob',gitBlob:m[2]};});
          }
          NS_PRIMARY_CAPTURE_INPUT
      - name: Capture exactly three installed primary bodies
        id: primary_baseline_capture
        if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/baseline-capture-')
        timeout-minutes: 2
