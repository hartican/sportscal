          out=pathlib.Path(os.environ['FOLLOW_CONTROL_EVIDENCE_DIR']);out.mkdir(parents=True,exist_ok=True)
          report_file=out/'supervisor.json';assert not report_file.exists(), 'Preserve prior attempt'
          root=pathlib.Path.cwd();node=pathlib.Path(shutil.which('node')).resolve();module=pathlib.Path(os.environ['PLAYWRIGHT_MODULE']).resolve()
          def digest(file):return hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()
          def git(*args):return subprocess.check_output(['git',*args],text=True,timeout=5).strip()
          assert sys.platform=='linux' and subprocess.check_output([str(node),'--version'],text=True).strip()=='v24.21.0'
          assert json.loads((module/'package.json').read_text())['version']=='1.64.1'
          runtime={'nodeSha256':digest(node),'playwrightPackageSha256':digest(module/'package.json'),'browserRegistrySha256':digest(module.parent/'playwright-core/browsers.json')}
          assert runtime['nodeSha256']=='7fde7b8afa198da66257f42ee2001d874c7355631e6d1579a5fb5ef1f246df4c'
          assert runtime['playwrightPackageSha256']=='313d23ce667d93962d3a1ab4be80908cefe840e4d9e48f1cd5863b91f65e8e39'
          assert runtime['browserRegistrySha256']=='2cfd419f71ac6475d81e1301fa86c34cf2a2a6bae2a0da4b5a2b18310216b6bf'
          if os.environ['FOLLOW_CONTROL_ENGINES']=='webkit':
              launcher=pathlib.Path(subprocess.check_output([str(node),'-e','process.stdout.write(require(process.argv[1]).webkit.executablePath())',str(module)],text=True,timeout=5))
              runtime.update(browserLauncherPath=str(launcher),browserLauncherSha256=digest(launcher))
              assert runtime['browserLauncherSha256']=='a85baad3d8c07173ac387a59b41500c382b21ed692afe0964d29aac247ccc63b'
          head=git('rev-parse','HEAD');before=git('status','--porcelain','--untracked-files=no');assert before==''
          harness=root/'scripts/validate-follow-sport-control-browser.js';source_hash=digest(harness)
          collector_options=re.findall(r'\}, (\{ passive: [^\n]+\})\);', harness.read_text());assert len(collector_options)==1
          started=time.monotonic();deadline=started+110
          report={'head':head,'tree':git('rev-parse','HEAD^{tree}'),'engine':os.environ['FOLLOW_CONTROL_ENGINES'],'runtime':runtime,'harnessSha256':source_hash,'collectorOptionsLiteral':collector_options[0],'attempts':1,'retries':0,'nativeLimitSeconds':90,'wholeLimitSeconds':110,'releaseAcceptance':False,'passed':False}
          report_file.write_text(json.dumps(report,indent=2)+'\n');proc=None
          try:
