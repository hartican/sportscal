      - name: Preserve bounded primary capture evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, already pinned in repository
        if: always() && (steps.primary_baseline_capture.outcome == 'success' || steps.primary_baseline_capture.outcome == 'failure' || steps.primary_baseline_capture.outcome == 'cancelled')
        with:
          name: primary-baseline-capture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
