name: Installed app upgrade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - app-version.json
      - index.html
      - service-worker.js
      - assets/**
      - config/**
      - styles/**
      - scripts/validate-installed-pwa-upgrade-browser.js
      - scripts/validate-peach-redesign-browser.js
      - scripts/validate-account-sync-recovery-browser.js
      - scripts/lib/account-sign-in-action-trace.js
      - scripts/validate-account-sign-in-action-trace.js
      - scripts/validate-new-user-journey.js
      - scripts/validate-server-persistence.js
      - scripts/lib/signup-setup-tests.js
      - scripts/lib/user-state-account-scope-tests.js
      - scripts/lib/user-state-optional-view-tests.js
      - scripts/validate-cross-device-sync.js
      - scripts/validate-empty-startup-meta.js
      - scripts/lib/installed-test-network.js
      - scripts/validate-installed-test-network.js
      - .github/installed-production-baseline.json
      - scripts/resolve-installed-production-baseline.js
      - scripts/validate-installed-production-baseline.js
      - scripts/lib/installed-navigation-observation.js
      - scripts/validate-installed-navigation-observation.js
      - scripts/validate-installed-offline-emulation-browser.js
      - scripts/validate-diamonds-retained-browser.js
      - scripts/validate-diamonds-retained-schedule.js
      - scripts/validate-notification-landing.js
      - scripts/validate-all-sports-offline-browser.js
      - scripts/lib/all-sports-offline-errors.js
      - scripts/validate-all-sports-offline-errors.js
      - scripts/fixtures/all-sports-offline-webkit-164-first-use.json
      - .github/workflows/installed-upgrade-tests.yml
      - scripts/app-shell-test-utils.js
      - scripts/validate-athletes.js
      - scripts/validate-code-inspector-ui.js
      - scripts/validate-follow-first.js
      - scripts/validate-major-events.js
      - scripts/validate-all-sports-card-fallback.js
      - scripts/validate-card-dismissal-learning.js
      - scripts/validate-shared-chat-ui.js
      - api/feed.js
      - lib/live-fixtures.js
      - lib/live-fixture-handler.js
      - lib/fixture-source-groups.js
      - lib/fixture-source-groups-v2.js
      - lib/calendar-handler.js
      - scripts/lib/global-app-adapter-qualification.js
      - scripts/verify-global-app-adapter.js
      - scripts/validate-hobby-feed-cache.js
      - scripts/validate-calendar-api.js
      - scripts/validate-production-sql-batches.js
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: installed-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixture-activation:
    name: Fixture activation / remaining three checks
    if: github.event.pull_request.draft == false || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/baseline-capture-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - name: Record exact source and runtime in job log
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node <<'JS'
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          console.log(JSON.stringify({testedSha:git('rev-parse','HEAD'),testedTree:git('rev-parse','HEAD^{tree}'),headSha:process.env.PR_HEAD_SHA,baseSha:process.env.PR_BASE_SHA,eventSha:process.env.GITHUB_SHA,node:process.version,platform:process.platform,arch:process.arch,limits:'Three existing source/mock activation checks, one bounded new-user journey unit and one bounded signup/setup compatibility check. Not production SQL, hosted wire or physical iPhone acceptance. Permanent dedicated DRAFT baseline capture runs only source/input checks and three primary bodies: ordinary application/full qualification/browser checks are skipped, never passed. Normal Ready retains full qualification, thirteen premerge affected gates and both installed-browser engines.'},null,2));
          JS
      - name: Verify permanent baseline capture source controls
        if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/baseline-capture-')
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 120s node scripts/validate-production-sql-batches.js
      - name: Bind permanent primary baseline capture input
        id: primary_baseline_input
        if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/baseline-capture-')
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 30s node <<'NS_PRIMARY_CAPTURE_INPUT'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process'),{TextDecoder}=require('node:util');
          const hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          // NS_PRIMARY_CAPTURE_PURE_BEGIN
          const E610_LIMITS=Object.freeze({source:10000,file:256*1024*1024,read:2*1024*1024*1024,event:4*1024*1024,body:65536,binding:16384,manifest:16*1024*1024,gitOutput:4*1024*1024,processMs:5000});
          function exactKeys(value,keys,label){
           assert(value&&typeof value==='object'&&!Array.isArray(value),label+' object required');
           assert.deepEqual(Object.keys(value).sort(),keys.slice().sort(),label+' closed keys');
          }
          function textValue(value,label){assert.equal(typeof value,'string',label+' string');assert(value.length>0&&!/[\u0000\r\n]/.test(value),label+' nonempty single line');return value;}
          function digestHex(value,length,label){assert.equal(typeof value,'string',label);assert(new RegExp('^[0-9a-f]{'+length+'}$').test(value),label+' lowercase hex');return value;}
          function positiveInteger(value,label){assert(Number.isSafeInteger(value)&&value>0,label+' positive integer');return value;}
          function canonicalDecimal(value,label){assert.equal(typeof value,'string',label);assert(/^[1-9][0-9]*$/.test(value),label+' canonical decimal');return value;}
          function unicodeSafe(value){
           if(typeof value==='string'){for(let i=0;i<value.length;i++){const c=value.charCodeAt(i);if(c>=0xd800&&c<=0xdbff){assert(i+1<value.length&&value.charCodeAt(i+1)>=0xdc00&&value.charCodeAt(i+1)<=0xdfff,'Unpaired high surrogate');i++;}else assert(c<0xdc00||c>0xdfff,'Unpaired low surrogate');}}
           else if(Array.isArray(value))value.forEach(unicodeSafe);
           else if(value&&typeof value==='object')for(const [key,item]of Object.entries(value)){unicodeSafe(key);unicodeSafe(item);}
          }
          function utf8Text(bytes){assert(Buffer.isBuffer(bytes),'Raw bytes required');const value=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(bytes);assert(Buffer.from(value,'utf8').equals(bytes),'Exact UTF8 bytes required');unicodeSafe(value);return value;}
          function relativePath(value){
           textValue(value,'Relative path');assert(!value.includes('\\')&&!value.includes('\t')&&!path.posix.isAbsolute(value),'Unsafe relative path');
           assert(!value.split('/').some(part=>!part||part==='.'||part==='..'),'Unsafe relative component');
           unicodeSafe(value);return value;
          }
          function inside(base,file){return file===base||file.startsWith(base+path.sep);}
          function ownedPath(base,file){
           assert(path.isAbsolute(base)&&path.isAbsolute(file),'Absolute owned paths required');textValue(base,'Owned root');textValue(file,'Owned file');
           assert.equal(path.resolve(base),base,'Normalized root');assert.equal(path.resolve(file),file,'Normalized file');assert(file!==base&&inside(base,file),'Owned path escape');return file;
          }
          function regularInputStat(st){assert(st&&typeof st.isFile==='function'&&typeof st.isSymbolicLink==='function','File stat');assert(st.isFile()&&!st.isSymbolicLink(),'Regular no-follow input required');assert(Number.isSafeInteger(st.size)&&st.size>=0&&st.size<=E610_LIMITS.file,'Regular input size bound');}
          function linkWithin(base,file,target){textValue(target,'Link target');assert(!path.isAbsolute(target)&&inside(base,path.resolve(path.dirname(file),target)),'Escaping link target');}
          function validateRuntimePlatform(node,platform,arch){assert.equal(node,'v24.21.0');assert.equal(platform,'linux');assert.equal(arch,'x64');}
          function validateInventory(actual,expected){exactKeys(actual,['revision','bytes','files'],'Deployment inventory');assert.deepEqual(actual,expected,'Complete reviewed deployment policy/closure/transform inventory');}
          function stableStats(before,after,label){
           for(const key of ['dev','ino','size','mode','mtimeMs','ctimeMs'])assert.equal(after[key],before[key],label+' stable '+key);
          }
          
          const PRIMARY_CAPTURE_BODY_KEYS=['schemaVersion','publisherHeadSha','publisherTreeSha','preparedForBaseSha','namedAllocationId','publisherBindingRecordSha256','captureFacts'];
          function captureRouteDecision(pr,repository){
           const ready=pr?.draft===false,key=value=>typeof value==='string'?value.toLowerCase():null;
           const repo=key(repository),capture=pr?.draft===true&&repo!==null&&repo.length>0&&key(pr?.head?.repo?.full_name)===repo&&(key(pr?.head?.ref)||'').startsWith('codex/baseline-capture-');
           return {runJob:ready||capture,runNormal:ready,runCapture:capture,runInstalledBrowser:ready,releaseAcceptance:false};
          }
          function primaryCaptureRequest(raw,event,env,observed,wall,validate){
           assert(Buffer.isBuffer(raw)&&raw.length>0&&raw.length<=E610_LIMITS.body,'Capture body byte bound');
           const text=utf8Text(raw),body=JSON.parse(text);unicodeSafe(body);assert.equal(JSON.stringify(body),text,'Capture body canonical compact JSON, NO LF');
           exactKeys(body,PRIMARY_CAPTURE_BODY_KEYS,'Capture request');assert.equal(body.schemaVersion,'primary-baseline-capture-request.v1');
           for(const key of ['publisherHeadSha','publisherTreeSha','preparedForBaseSha'])digestHex(body[key],40,key);
           digestHex(body.publisherBindingRecordSha256,64,'Independent publisher record');
           assert.equal(typeof body.namedAllocationId,'string');assert(body.namedAllocationId.length>0&&body.namedAllocationId.length<=256&&body.namedAllocationId.trim().length>0&&!body.namedAllocationId.includes('SOURCE_TEMPLATE'),'Real bounded allocation reference');
           exactKeys(body.captureFacts,['baselineSha','baselineVersion','deployment','alias','publisherWindow'],'Capture facts');
           assert.equal(env.GITHUB_ACTIONS,'true');assert.equal(env.GITHUB_EVENT_NAME,'pull_request');assert.equal(env.GITHUB_JOB,'fixture-activation');
           assert.equal(env.GITHUB_REPOSITORY.toLowerCase(),'hartican/sportscal');assert.equal(event.repository.full_name.toLowerCase(),env.GITHUB_REPOSITORY.toLowerCase());
           assert.equal(event.pull_request.draft,true,'Capture is DRAFT only');assert(captureRouteDecision(event.pull_request,env.GITHUB_REPOSITORY).runCapture,'Dedicated same-repository capture branch');
           assert(['opened','synchronize','reopened'].includes(event.action),'Existing capture PR event only');assert.equal(env.GITHUB_RUN_ATTEMPT,'1','No capture rerun');
           canonicalDecimal(env.GITHUB_RUN_ID,'Run');positiveInteger(event.number,'PR number');assert.equal(event.pull_request.number,event.number);
           assert.equal(env.GITHUB_REF,'refs/pull/'+event.number+'/merge');
           const H=digestHex(event.pull_request.head.sha,40,'Actual H'),B=digestHex(event.pull_request.base.sha,40,'Actual base'),T=digestHex(env.GITHUB_SHA,40,'Actual T');
           assert.equal(body.publisherHeadSha,H);assert.equal(body.preparedForBaseSha,B);assert.equal(observed.checkoutSha,T);assert.deepEqual(observed.parents,[B,H],'Exact capture merge parents');
           assert.equal(observed.headTree,body.publisherTreeSha);assert.equal(observed.testedTree,body.publisherTreeSha,'Capture H/T trees equal');
           const binding={schemaVersion:'primary-baseline-capture-binding.v1',baselineSha:body.captureFacts.baselineSha,baselineVersion:body.captureFacts.baselineVersion,preparedForBaseSha:B,collectorSha:T,collectorTree:observed.testedTree,deployment:body.captureFacts.deployment,alias:body.captureFacts.alias,publisherWindow:body.captureFacts.publisherWindow};
           assert.equal(typeof validate,'function','Exact collector binding validator');validate(binding,wall);
           return {body,binding,H,B,T,bodySha256:hash(raw)};
          }
          // NS_PRIMARY_CAPTURE_PURE_END
          
          const root=fs.realpathSync(process.cwd());let readBytes=0;
          function charge(size){assert(Number.isSafeInteger(size)&&size>=0&&size<=E610_LIMITS.file,'Per-file read bound');readBytes+=size;assert(readBytes<=E610_LIMITS.read,'Metadata read bound');}
          function parentDirectories(file,stop){
           for(let d=path.dirname(file);;d=path.dirname(d)){
            const st=fs.lstatSync(d);assert(st.isDirectory()&&!st.isSymbolicLink(),'Symlink/non-directory parent');
            if(d===stop)break;assert(d!==path.dirname(d)&&inside(stop,d),'Parent escaped selected root');
           }
          }
          function stableBytes(file,maximum=E610_LIMITS.file,base=root){
           assert(path.isAbsolute(file)&&inside(base,file),'Read outside selected root');parentDirectories(file,base);
           const before=fs.lstatSync(file);regularInputStat(before);assert(before.size<=maximum,'Input byte bound');charge(before.size);
           const fd=fs.openSync(file,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
           let value;
           try{const opened=fs.fstatSync(fd);stableStats(before,opened,'Opened input');value=fs.readFileSync(fd);stableStats(opened,fs.fstatSync(fd),'Read input');}
           finally{fs.closeSync(fd);}
           stableStats(before,fs.lstatSync(file),'Path input');assert.equal(value.length,before.size,'Stable read length');return value;
          }
          function rawIdentity(file,relative,base=root){
           parentDirectories(file,base);const st=fs.lstatSync(file),permissions=(st.mode&0o7777).toString(8).padStart(4,'0');
           assert(st.isFile()||st.isSymbolicLink(),'Unsupported identity kind');let bytes,link;
           if(st.isSymbolicLink()){
            bytes=fs.readlinkSync(file,{encoding:'buffer'});charge(bytes.length);link=utf8Text(bytes);
            linkWithin(base,file,link);
            assert(inside(base,fs.realpathSync(file)),'Resolved link outside selected root');stableStats(st,fs.lstatSync(file),'Link identity');
           }else bytes=stableBytes(file,E610_LIMITS.file,base);
           const gitBlob=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
           return {path:relative,bytes:bytes.length,permissions,mode:st.isSymbolicLink()?'120000':st.mode&0o111?'100755':'100644',sha256:hash(bytes),gitBlob,...(st.isSymbolicLink()?{link}:{})};
          }
          function processOutput(command,args,maximum=E610_LIMITS.gitOutput,timeout=E610_LIMITS.processMs){
           return cp.execFileSync(command,args,{cwd:root,encoding:null,maxBuffer:maximum,timeout,stdio:['ignore','pipe','pipe']});
          }
          const git=(...args)=>utf8Text(processOutput('git',args)).trim();
          function sourceBytes(entry){
           const file=path.join(root,...entry.path.split('/'));parentDirectories(file,root);
           let bytes;if(entry.mode==='120000'){
            const st=fs.lstatSync(file);assert(st.isSymbolicLink(),'Source link mode');bytes=fs.readlinkSync(file,{encoding:'buffer'});charge(bytes.length);
            const target=utf8Text(bytes);linkWithin(root,file,target);assert(inside(root,fs.realpathSync(file)),'Source link confinement');stableStats(st,fs.lstatSync(file),'Source link');
           }else{
            const st=fs.lstatSync(file);assert.equal(st.mode&0o111?'100755':'100644',entry.mode,'Source executable mode');bytes=stableBytes(file);
           }
           assert.equal(crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex'),entry.gitBlob,'Working bytes versus actual raw Git blob');return bytes;
          }
          function sourceInventory(entries){return entries.map(e=>{const bytes=sourceBytes(e);return {...e,bytes:bytes.length,sha256:hash(bytes)};});}
          function cleanCheckout(){
           assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'','Clean tracked/untracked checkout required');
           assert.equal(git('ls-files','--others','--exclude-standard','-z'),'','Unexpected untracked source');
          }
          
          assert.equal(process.version,'v24.21.0');assert.equal(process.platform,'linux');assert.equal(process.arch,'x64');
          assert(process.env.NODE_TLS_REJECT_UNAUTHORIZED!=='0'&&!process.env.NODE_EXTRA_CA_CERTS&&!process.env.SSL_CERT_FILE&&!process.env.SSL_CERT_DIR&&!process.env.NODE_OPTIONS,'Original collector TLS configuration boundary');
          const eventFile=fs.realpathSync(process.env.GITHUB_EVENT_PATH),event=JSON.parse(utf8Text(stableBytes(eventFile,E610_LIMITS.event,path.dirname(eventFile))));
          assert.equal(typeof event.pull_request.body,'string');unicodeSafe(event.pull_request.body);
          const requestBytes=Buffer.from(event.pull_request.body,'utf8');
          assert(requestBytes.length<=E610_LIMITS.body,'Capture request bound');
          const H=digestHex(event.pull_request.head.sha,40,'Actual H'),T=digestHex(process.env.GITHUB_SHA,40,'Actual T');
          const observed={checkoutSha:git('rev-parse','HEAD'),parents:git('show','-s','--format=%P',T).split(' '),headTree:git('rev-parse',H+'^{tree}'),testedTree:git('rev-parse',T+'^{tree}')};
          const collectorPath=path.join(root,'scripts/verify-production-release.js'),collectorBytes=stableBytes(collectorPath,256*1024);
          assert.equal(hash(collectorBytes),'6123d29c05e0c34d74bedac7a1e6af7d9b44c7708d779f7ae16107b85cf95fc3','Unchanged reviewed collector only');
          const collector=require(collectorPath);
          const selected=primaryCaptureRequest(requestBytes,event,process.env,observed,Date.now(),collector.validateCaptureBinding);
          cleanCheckout();
          const entries=parseCaptureEntries(processOutput('git',['ls-tree','-rz','--full-tree',T]));
          const rows=sourceInventory(entries);
          assert.equal(git('rev-parse','HEAD'),T);assert.equal(git('rev-parse',H+'^{tree}'),selected.body.publisherTreeSha);cleanCheckout();
          const temporary=fs.realpathSync(process.env.RUNNER_TEMP),work=path.join(temporary,'ns-primary-baseline-capture');
          assert(path.isAbsolute(temporary)&&!inside(root,work),'Capture work outside checkout');
          fs.mkdirSync(work,{mode:0o700});const workStat=fs.lstatSync(work);assert(workStat.isDirectory()&&!workStat.isSymbolicLink()&&workStat.uid===process.getuid()&&(workStat.mode&0o077)===0);
          function save(name,bytes){
           const file=ownedPath(work,path.join(work,name));assert(bytes.length>0&&bytes.length<=E610_LIMITS.binding);fs.writeFileSync(file,bytes,{mode:0o600,flag:'wx'});
           const st=fs.lstatSync(file);assert(st.isFile()&&!st.isSymbolicLink()&&st.nlink===1&&st.uid===process.getuid()&&(st.mode&0o077)===0);
           const got=stableBytes(file,E610_LIMITS.binding,work);assert(got.equals(bytes));return {path:file,bytes:got.length,sha256:hash(got)};
          }
          const binding=save('binding.json',Buffer.from(JSON.stringify(selected.binding,null,2)+'\n'));
          collector.readCaptureBinding(binding.path);
          // Procedural boundary selected by RELEASE 9f0baff2f51d730d58922cb7105d638fde68915cd0a0f98f91bb18b83e96155c.
          // publisherBindingRecordSha256 is the independently owned INTENT digest, not the ACK or a self-referential body digest.
          // INTENT excludes final-body SHA; independent RELEASE ACK binds actual INTENT SHA plus the exact final no-LF body SHA.
          // Sole PUBLISH must stop BEFORE any trigger without actual fresh allocation/window/ACK/body/H/tree/base/branch/not-submitted facts.
          // Permit one opened event only; unknown or uncertain submission consumes the allocation, with no reopen/sync/rerun/blind retry.
          // This external procedure does not supply a trusted cloud ACK lookup, cryptographic authority or runtime replay prevention.
          // Pre-submission T/run are NULL until observed; later outer joins cannot retrospectively authorise a GET.
          const context={schemaVersion:'primary-baseline-capture-context.v1',headRole:'pull_request.head.sha',publisherHeadSha:selected.H,testedMergeSha:selected.T,preparedForBaseSha:selected.B,headTree:observed.headTree,testedTree:observed.testedTree,parents:observed.parents,sourceEntries:rows.length,sourceMapSha256:hash(Buffer.from(JSON.stringify(rows))),collectorImplementationSha256:hash(collectorBytes),eventBodySha256:selected.bodySha256,publisherBindingRecordSha256:selected.body.publisherBindingRecordSha256,namedAllocationId:selected.body.namedAllocationId,runId:process.env.GITHUB_RUN_ID,runAttempt:1,jobKey:process.env.GITHUB_JOB,ref:process.env.GITHUB_REF,bindingSha256:binding.sha256,sourceChecksPassed:true,primaryReadsStarted:false,normalChecks:'SKIPPED_NOT_PASSED',releaseAcceptance:false,publisherBindingReferenceMeaning:'SHA256 of sole-PUBLISH INTENT; INTENT excludes final-body SHA; independent RELEASE ACK binds INTENT SHA and exact final raw no-LF body SHA',authorityBoundary:'PERMITTED_SOLE_PUBLISH_PROCEDURE_ONLY',preSubmissionAckVerifiedByThisJob:false,trustedCloudAckLookup:false,cryptographicReplayProtection:false,permittedSubmissionRule:'External sole-PUBLISH protocol: one opened event only; stop before any trigger unless actual finite allocation, held fresh window, independent matching ACK, exact body/INTENT/H/tree/base, unique branch and not-submitted witness are known; uncertain submission consumes allocation without retry',contextTrust:'Mutable body reference is not authority. Independent PREsubmission INTENT/body ACK is an externally enforced procedural boundary for permitted sole-PUBLISH submissions only; this job cannot authenticate that ACK or prevent unauthorised actor/event replay. Future T/run remain unknown in the external PREsubmission record until observed; actual outer body/H/T/run/attempt/job joins are acceptance evidence, never retroactive GET authority.'};
