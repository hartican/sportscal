              report['pid']=proc.pid
              try:report['exitCode']=proc.wait(timeout=90)
              except subprocess.TimeoutExpired:report['timedOut']=True
          except Exception as error:report['failure']=type(error).__name__
          finally:
              if proc is not None:report['cleanup']=cleanup(proc,deadline)
              report['sourceUnchanged']=git('rev-parse','HEAD')==head and git('status','--porcelain','--untracked-files=no')==before and digest(harness)==source_hash
              report['elapsedSeconds']=time.monotonic()-started
              report['passed']=report.get('exitCode')==0 and report['sourceUnchanged'] and report.get('cleanup',{}).get('complete') and not report.get('cleanup',{}).get('forced') and report['elapsedSeconds']<=110
              report_file.write_text(json.dumps(report,indent=2)+'\n')
