name: Installed app upgrade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - app-version.json
      - index.html
      - service-worker.js
      - assets/**
      - config/**
      - styles/**
      - scripts/validate-installed-pwa-upgrade-browser.js
      - scripts/validate-account-sync-recovery-browser.js
      - scripts/lib/installed-test-network.js
      - scripts/validate-installed-test-network.js
      - .github/installed-production-baseline.json
      - scripts/resolve-installed-production-baseline.js
      - scripts/validate-installed-production-baseline.js
      - scripts/lib/installed-navigation-observation.js
      - scripts/validate-installed-navigation-observation.js
      - scripts/validate-installed-offline-emulation-browser.js
      - scripts/validate-diamonds-retained-browser.js
      - scripts/validate-diamonds-retained-schedule.js
      - scripts/validate-notification-landing.js
      - scripts/validate-all-sports-offline-browser.js
      - scripts/lib/all-sports-offline-errors.js
      - scripts/validate-all-sports-offline-errors.js
      - scripts/fixtures/all-sports-offline-webkit-164-first-use.json
      - .github/workflows/installed-upgrade-tests.yml

permissions:
  contents: read

concurrency:
  group: installed-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  installed-upgrade:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - name: Verify and resolve installed production baseline
        id: installed_baseline
        env:
          NS_INSTALLED_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ns-upgrade-proof"
          set -o pipefail
          node scripts/validate-installed-production-baseline.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/baseline-controls.log"
          node scripts/resolve-installed-production-baseline.js --resolve 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/installed-baseline.log"
      - name: Record exact source and runtime
        env:
          BASELINE_SHA: ${{ steps.installed_baseline.outputs.baseline_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ns-upgrade-proof"
          node <<'JS' > "$RUNNER_TEMP/ns-upgrade-proof/context.json"
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          console.log(JSON.stringify({testedSha:git('rev-parse','HEAD'),testedTree:git('rev-parse','HEAD^{tree}'),headSha:process.env.PR_HEAD_SHA,baseSha:process.env.PR_BASE_SHA,baselineSha:process.env.BASELINE_SHA,node:process.version,zlib:process.versions.zlib,playwright:'1.64.1',platform:process.platform,arch:process.arch,limits:'Existing unchanged installed upgrade and account recovery harnesses on Linux; account transport is mocked loopback. Not hosted or physical iPhone acceptance. No production credentials or deployment.'},null,2));
          JS
      - name: Use the official Ubuntu archive for test dependencies
        run: |
          set -o pipefail
          sudo python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/apt-mirror.log"
          from pathlib import Path
          import json
          root = Path('/etc/apt')
          files = [*root.glob('*.list'), *root.glob('apt-mirrors*.txt'),
                   *(root / 'sources.list.d').glob('*.list'), *(root / 'sources.list.d').glob('*.sources')]
          changed = []
          has_archive = False
          for file in files:
              if not file.is_file() or file.is_symlink():
                  continue
              before = file.read_text()
              after = before.replace('azure.archive.ubuntu.com', 'archive.ubuntu.com')
              has_archive = has_archive or 'archive.ubuntu.com' in after
              if after != before:
                  file.write_text(after)
                  changed.append(str(file))
          assert has_archive, 'Expected official Ubuntu package archive configuration'
          print(json.dumps({'changedFiles': changed, 'archive': 'archive.ubuntu.com', 'packageSignatureValidation': 'unchanged'}))
          PY
      - name: Install isolated test dependencies
        run: |
          set -o pipefail
          {
            npm ci
            npm install --prefix "$RUNNER_TEMP/ns-playwright" --no-save --package-lock=false playwright@1.64.1
            node "$RUNNER_TEMP/ns-playwright/node_modules/playwright/cli.js" install --with-deps "${{ matrix.browser }}"
          } 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/install.log"
      - name: Verify browser tool offline emulation
        env:
          PWA_BROWSER: ${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ns-playwright/node_modules/playwright"
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 90s node scripts/validate-installed-offline-emulation-browser.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/offline-emulation.log"
      - name: Verify installed upgrade and offline restart
        env:
          PWA_BASELINE_SHA: ${{ steps.installed_baseline.outputs.baseline_sha }}
          PWA_BROWSER: ${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ns-playwright/node_modules/playwright"
          set -o pipefail
          node scripts/validate-installed-test-network.js
          node scripts/validate-diamonds-retained-schedule.js
          node scripts/validate-notification-landing.js
          node scripts/validate-installed-pwa-upgrade-browser.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/browser.log"
      - name: Verify installed All Sports offline behavior
        env:
          ALL_SPORTS_OFFLINE_ENGINES: ${{ matrix.browser }}
          ALL_SPORTS_OFFLINE_CASES: first-use,return
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ns-playwright/node_modules/playwright"
          set -o pipefail
          node scripts/validate-all-sports-offline-errors.js
          node scripts/validate-all-sports-offline-browser.js --check-cleanup
          node scripts/validate-all-sports-offline-browser.js --check-fixtures
          timeout --signal=TERM --kill-after=5s 150s node scripts/validate-all-sports-offline-browser.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/all-sports-offline.log"
      - name: Verify account recovery and copied diagnostics
        env:
          ACCOUNT_RECOVERY_BROWSER: ${{ matrix.browser }}
          ACCOUNT_RECOVERY_CASE: all
          ACCOUNT_RECOVERY_DIAGNOSTIC_TRACE: '1'
          QA_BROWSER_CHANNEL: chromium
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ns-playwright/node_modules/playwright"
          set -o pipefail
          node scripts/validate-account-sync-recovery-browser.js 2>&1 | tee "$RUNNER_TEMP/ns-upgrade-proof/account-recovery.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-upgrade-${{ github.event.pull_request.head.sha }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/ns-upgrade-proof
          retention-days: 1
