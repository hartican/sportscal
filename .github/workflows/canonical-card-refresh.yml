name: Canonical card refresh
run-name: ${{ inputs.near_capture && format('Near capture {0}', inputs.near_capture_id) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      quick:
        description: Verify the daily incremental refresh instead of full reconciliation
        type: boolean
        default: false
      near_capture:
        description: One allocated private capture; no refresh or deployment
        type: boolean
        default: false
      application_source_sha:
        type: string
        default: ''
      near_capture_id:
        type: string
        default: ''
      near_recipient_public_key:
        description: Ephemeral recipient public PEM only
        type: string
        default: ''
      near_driver_sha256:
        type: string
        default: ''
      near_control_sha:
        type: string
        default: ''
  schedule:
    - cron: "0 3 * * *"
      timezone: Australia/Sydney

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ inputs.near_capture && 'ns-near-current-capture' || 'canonical-card-refresh' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Select tournament or baseline cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ inputs.near_capture && 'true' || 'false' }}" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "quick=${{ inputs.quick && '1' || '0' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$(TZ=Australia/Sydney date +%u)" == "7" ]]; then
            echo "quick=0" >> "$GITHUB_OUTPUT"
          else
            echo "quick=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project and deployment dependencies
        if: steps.cadence.outputs.run == 'true'
        run: |
          npm ci
          npm install --global vercel@59.1.4

      - name: Link the immutable deployment target
        if: steps.cadence.outputs.run == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          node -e 'const fs=require("node:fs"); fs.writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}, null, 2) + "\n", {mode:0o600})'

      - name: Configure release author
        if: steps.cadence.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh, validate, publish and deploy
        if: steps.cadence.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TOURNAMENT_HYDRATION_REPORT: ${{ runner.temp }}/tournament-hydration-report.json
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTBALL_DATA_REPORT: ${{ runner.temp }}/football-data-backup-report.json
          QUICK_RESULTS_REPORT: ${{ runner.temp }}/quick-results-report.json
          REFRESH_REPORT: ${{ runner.temp }}/canonical-refresh-report.json
          KNOWN_FINAL_RESULTS_REPORT: ${{ runner.temp }}/known-final-results-report.json
          GOLF_SOURCE_REPORT: ${{ runner.temp }}/golf-source-report.json
          WRC_SOURCE_FAILURE_REPORT: ${{ runner.temp }}/wrc-source-failure.json
          RELEASE_COMMIT_MESSAGE: Automated canonical sports refresh
          QUICK_RESULTS: ${{ steps.cadence.outputs.quick }}
        run: bash scripts/update-sportscal-cards-and-release.sh

      - name: Clean temporary and replaced profile pictures
        if: always() && github.event_name == 'schedule' && steps.cadence.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/maintain-profile-avatars.js

      - name: Preserve refresh diagnostics
        if: always() && inputs.near_capture != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: refresh-diagnostics
          path: |
            ${{ runner.temp }}/tournament-hydration-report.json
            ${{ runner.temp }}/quick-results-report.json
            ${{ runner.temp }}/canonical-refresh-report.json
            ${{ runner.temp }}/known-final-results-report.json
            ${{ runner.temp }}/football-data-backup-report.json
            ${{ runner.temp }}/golf-source-report.json
            ${{ runner.temp }}/wrc-source-failure.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Check out exact capture control
        if: github.event_name == 'workflow_dispatch' && inputs.near_capture == true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out fixed offline-tested capture application
        if: github.event_name == 'workflow_dispatch' && inputs.near_capture == true
        uses: actions/checkout@v5
        with:
          ref: 96bcdd8e4177496f4a6866b59ff1ec1182468815
          path: application96
          fetch-depth: 1
          persist-credentials: false

      - name: Set up existing capture Node runtime
        if: github.event_name == 'workflow_dispatch' && inputs.near_capture == true
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Capture one bounded private near response
        id: near_capture
        if: github.event_name == 'workflow_dispatch' && inputs.near_capture == true
        env:
          NS_NEAR_APP_SHA: ${{ inputs.application_source_sha }}
          NS_NEAR_CAPTURE_ID: ${{ inputs.near_capture_id }}
          NS_NEAR_RECIPIENT_PUBLIC_KEY: ${{ inputs.near_recipient_public_key }}
          NS_NEAR_DRIVER_SHA: ${{ inputs.near_driver_sha256 }}
          NS_NEAR_CONTROL_SHA: ${{ inputs.near_control_sha }}
          NS_NEAR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/near-response-capture-ci.js --capture

      - name: Return only encrypted near capture and redacted manifest
        id: near_return
        if: always() && github.event_name == 'workflow_dispatch' && inputs.near_capture == true && steps.near_capture.outputs.return_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: near-current-capture-${{ inputs.near_capture_id }}
          path: |
            ${{ steps.near_capture.outputs.return_dir }}/encrypted.json
            ${{ steps.near_capture.outputs.return_dir }}/manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove exact uploaded job-owned near plaintext
        if: always() && github.event_name == 'workflow_dispatch' && inputs.near_capture == true && steps.near_return.outcome == 'success'
        env:
          NS_NEAR_CAPTURE_ID: ${{ inputs.near_capture_id }}
        run: node scripts/near-response-capture-ci.js --cleanup
