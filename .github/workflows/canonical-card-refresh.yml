name: Canonical card refresh
run-name: Read-only fixture transport preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-card-refresh
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
      - name: Read complete public scopes without refresh or deployment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/verify-complete-fixture-transport.js --live-read --scope-file=diagnostics/public-fixture-transport-scope.json --output=transport-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-only-transport-proof
          path: transport-proof.json
