name: Sportscal production
run-name: ${{ inputs.editorial_prepare && 'Prepare editorial' || 'Deploy' }} ${{ inputs.sha }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit on main
        required: true
      request_id:
        description: Request correlation ID
        required: true
      rebuild:
        description: Intentionally rebuild unchanged code after environment changes
        type: boolean
        default: false
      selected_feed_proof_sha:
        description: Optional one-use selected Feed proof allocation for this exact SHA
        required: false
        default: ''
      editorial_prepare:
        description: Prepare reviewed editorial only; never publish or deploy
        type: boolean
        default: false
      editorial_research_sha256:
        description: SHA256 of the decoded reviewed public research JSON
        type: string
        required: false
      editorial_research_b64:
        description: Base64 of reviewed PUBLIC research only; never private controls
        type: string
        required: false
      editorial_recipient_public_key:
        description: Root approved ephemeral RSA public PEM only; never a private key
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: sportscal-production-and-cleanup
  cancel-in-progress: false
jobs:
  sql-safety:
    if: inputs.editorial_prepare != true
    name: SQL safety / ${{ matrix.batch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [canonical-context, near-selection, grouped-view, grouped-diagnostic]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify requested mainline SQL checks
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
          git checkout --detach "$RELEASE_SHA"
      - run: npm ci
      - name: canonical-context-pg18
        if: matrix.batch == 'canonical-context'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          node scripts/validate-canonical-context-batch.js
      - name: canonical-context-pg17
        if: matrix.batch == 'canonical-context'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          PGLITE_MODULE=pglite-pg17 node scripts/validate-canonical-context-batch.js
      - name: near-selection-pg18
        if: matrix.batch == 'near-selection'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          NEAR_EVIDENCE_DIR="$RUNNER_TEMP/near-selection-pg18" node scripts/validate-match-centre-near-selection.js
      - name: near-selection-pg17
        if: matrix.batch == 'near-selection'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          NEAR_EVIDENCE_DIR="$RUNNER_TEMP/near-selection-pg17" PGLITE_MODULE=pglite-pg17 node scripts/validate-match-centre-near-selection.js
      - name: near-receipt-join-pg18
        if: matrix.batch == 'near-selection'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          NEAR_EVIDENCE_DIR="$RUNNER_TEMP/near-selection-pg18/receipt-join" node scripts/validate-near-receipt-join.js
      - name: near-receipt-join-pg17
        if: matrix.batch == 'near-selection'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          NEAR_EVIDENCE_DIR="$RUNNER_TEMP/near-selection-pg17/receipt-join" PGLITE_MODULE=pglite-pg17 node scripts/validate-near-receipt-join.js
      - name: grouped-view-pg18
        if: matrix.batch == 'grouped-view'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          node scripts/validate-grouped-fixture-view.js
      - name: grouped-view-pg17
        if: matrix.batch == 'grouped-view'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          PGLITE_MODULE=pglite-pg17 node scripts/validate-grouped-fixture-view.js
      - name: grouped-diagnostic-pg17
        if: matrix.batch == 'grouped-diagnostic'
        shell: bash
        run: |
          started=$SECONDS
          trap 'rc=$?; echo "SQL_CHECK elapsed_seconds=$((SECONDS - started)) exit=$rc"; exit "$rc"' EXIT
          PGLITE_MODULE=pglite-pg17 node scripts/validate-grouped-fixture-diagnostic.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: ${{ always() && matrix.batch == 'near-selection' }}
        with:
          name: sql-near-selection-${{ inputs.sha }}
          path: ${{ runner.temp }}/near-selection-pg*
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    if: inputs.editorial_prepare != true
    needs: [sql-safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NS_SERIALIZED_DEPLOY: '1'
      NS_FORCE_REDEPLOY: ${{ inputs.rebuild && '1' || '0' }}
      NS_DEPLOY_REPORT_DIR: /tmp/sportscal-release-report
      NS_SELECTED_FEED_PROOF_SHA: ${{ inputs.selected_feed_proof_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify requested mainline release
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
          test -z "$NS_SELECTED_FEED_PROOF_SHA" || test "$NS_SELECTED_FEED_PROOF_SHA" = "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
      - run: npm ci && npm install --global vercel@59.1.4
      - name: Verify production SQL batch contract
