  editorial-preparation:
    if: github.event_name == 'workflow_dispatch' && inputs.editorial_prepare == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      INPUT_SOURCE_SHA: ${{ inputs.sha }}
      INPUT_RESEARCH_SHA256: ${{ inputs.editorial_research_sha256 }}
      INPUT_RESEARCH_B64: ${{ inputs.editorial_research_b64 }}
      INPUT_RECIPIENT_PUBLIC_KEY: ${{ inputs.editorial_recipient_public_key }}
      INPUT_QUICK: 'false'
      PREP_RELEASE_REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
      PREP_SELECTED_FEED_PROOF_SHA: ${{ inputs.selected_feed_proof_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PREP_RUN_ID: ${{ github.run_id }}
      PREP_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Require immutable manual preparation selection
        shell: bash
        run: |
          [[ "$INPUT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_RESEARCH_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$INPUT_SOURCE_SHA" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$INPUT_QUICK" == "false" ]]
          [[ "$PREP_RELEASE_REBUILD" == "false" ]]
          [[ -z "$PREP_SELECTED_FEED_PROOF_SHA" ]]

      - name: Check out the reviewed immutable source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up existing Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install existing project dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify preparation and ordinary production source contracts
        env:
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          timeout --signal=TERM --kill-after=5s 120s node scripts/validate-production-sql-batches.js
          timeout --signal=TERM --kill-after=5s 120s node scripts/validate-adaptive-editorial.js

      - name: Test transport then prepare canonical editorial without service writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prepare-adaptive-editorial.js

      - name: Return only authenticated ciphertext and safe metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: editorial-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/editorial-preparation-return/private-return.encrypted.json
            ${{ runner.temp }}/editorial-preparation-return/public-manifest.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove exact job-owned private and encrypted staging
        if: always()
        shell: bash
        run: |
          node scripts/prepare-adaptive-editorial.js --cleanup
          rm -f -- "$RUNNER_TEMP/editorial-preparation-return/private-return.encrypted.json" "$RUNNER_TEMP/editorial-preparation-return/public-manifest.json"
