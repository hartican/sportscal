          node scripts/validate-fixture-highlights.js
          node scripts/validate-snapshot-read-diagnostics.js
          node scripts/validate-live-afl-adapter.js
          node scripts/validate-asia-cup-source.js --published
          node scripts/validate-cricket-current-results.js
          node scripts/validate-feed-cricket-score-address.js
          node scripts/validate-selected-feed-public.js
          node scripts/validate-source-coverage.js
          node scripts/validate-card-timing.js
          node scripts/validate-cricket-provider-identities.js --published
          node scripts/validate-live-coverage-publication.js
          node scripts/validate-match-observations.js
          node scripts/validate-compact-scores-database.js
          node scripts/validate-fixture-history-retention.js
          node scripts/validate-live-fixture-api.js
          node scripts/validate-global-fixture-public.js
          node scripts/validate-grouped-fixture-transport.js
          node scripts/validate-global-app-adapter.js
          node scripts/validate-laver-cup.js
      - name: Verify shared fixture publication input
        if: steps.release_exception.outputs.tests_waived != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NS_NEAR_APP_RELEASE_SHA: ${{ inputs.sha }}
        run: |
          node scripts/validate-live-coverage-publication.js --live-read
          node scripts/validate-account-erasure-preflight.js --live-read
          node scripts/verify-near-app-adapter.js --live-read
          node scripts/verify-global-app-adapter.js --live-read --dictionary-v2
      - name: Bind project and preserve current production
        run: node scripts/prepare-production-release.js
      - name: Deploy or reuse exact release
        run: bash scripts/deploy-current-commit.sh
      - name: Verify public release
        run: |
          node scripts/verify-production-release.js
          node scripts/verify-match-centre-public.js
          node scripts/validate-security-headers.js https://nothingsport.vercel.app
          feed_status=0
          node scripts/verify-selected-feed-public.js || feed_status=$?
          node scripts/verify-global-fixture-public.js
          exit "$feed_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: release-${{ inputs.sha }}
          path: /tmp/sportscal-release-report
          retention-days: 14
