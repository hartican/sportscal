name: Sportscal production
run-name: Deploy ${{ inputs.sha }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit on main
        required: true
      request_id:
        description: Request correlation ID
        required: true
      rebuild:
        description: Intentionally rebuild unchanged code after environment changes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sportscal-production-and-cleanup
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NS_SERIALIZED_DEPLOY: '1'
      NS_FORCE_REDEPLOY: ${{ inputs.rebuild && '1' || '0' }}
      NS_DEPLOY_REPORT_DIR: /tmp/sportscal-release-report
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify requested mainline release
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
          git checkout --detach "$RELEASE_SHA"
      - run: npm ci && npm install --global vercel@59.1.4
      - name: Verify feed and deployment safety contracts
        run: |
          node scripts/build-app-shell-runtime.js --check
          node scripts/validate-security-headers.js
          node scripts/validate-account-erasure-preflight.js
          node scripts/validate-chat-erasure-database.js
          node scripts/validate-notification-erasure-database.js
          node scripts/validate-erasure-write-barrier.js
          node scripts/validate-erasure-storage.js
          node scripts/validate-notification-send-erasure.js
          node scripts/validate-erasure-workflow.js
          node scripts/validate-profile-avatars.js
          node scripts/validate-shared-chat-ui.js
          node scripts/validate-private-fixture-chat.js
          node scripts/validate-app-update-version.js
          node scripts/validate-hobby-feed-cache.js
          node scripts/validate-hobby-feed-client.js
          node scripts/validate-hobby-deployments.js
          node scripts/validate-server-feed.js
          node scripts/validate-follow-policy-parity.js
          node scripts/validate-f1-parent-feed.js
          node scripts/validate-odi-display.js
          node scripts/validate-nrl-grand-final.js --published
          node scripts/validate-requested-sports.js
          node scripts/validate-card-identities.js
          node scripts/validate-refresh-resume.js
          node scripts/validate-marquee-candidates.js
          node scripts/validate-football-classification.js --published
          node scripts/validate-football-schedule.js
          node scripts/validate-football-viewing.js
          node scripts/validate-openligadb-football.js
          node scripts/validate-european-football-standings.js
          node scripts/validate-coverage-quality.js
          node scripts/audit-coverage-quality.js "$NS_DEPLOY_REPORT_DIR/coverage-quality.json"
          node scripts/validate-dispatch-bundle.js
          node scripts/validate-crowd-foresight.js
          node scripts/validate-nothingscore-submissions.js
          node scripts/validate-live-rating-alerts.js
          node scripts/validate-backend-efficiency.js
          node scripts/validate-notifications.js
          node scripts/validate-reminder-schedules.js
          node scripts/validate-pilot-readout.js
          node scripts/validate-pilot-readout-sql.js
          node scripts/validate-live-fixtures.js
          node scripts/validate-match-observations.js
          node scripts/validate-laver-cup.js
      - name: Bind project and preserve current production
        run: node scripts/prepare-production-release.js
      - name: Deploy or reuse exact release
        run: bash scripts/deploy-current-commit.sh
      - name: Verify public release
        run: |
          node scripts/verify-production-release.js
          node scripts/validate-security-headers.js https://nothingsport.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ inputs.sha }}
          path: /tmp/sportscal-release-report
          retention-days: 14
