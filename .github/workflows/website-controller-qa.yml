# ROOT one-off website privacy qualification; no app or Site publication.
name: Website browser privacy qualification
on:
  push:
    branches: [codex/website-controller-qa-20261030]
    paths: [.github/workflows/website-controller-qa.yml, website-privacy-qa/**]
permissions:
  contents: read
concurrency:
  group: website-privacy-qa-d9460cae
  cancel-in-progress: false
jobs:
  privacy:
    if: github.repository == 'hartican/sportscal' && github.ref == 'refs/heads/codex/website-controller-qa-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - name: Reserve fresh failure artifact before checkout or setup
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'ns-web-qa-proof-${{ matrix.engine }}'
          folder.mkdir()
          (folder / 'initial.json').write_text(json.dumps({'passed': False, 'status': 'not-started', 'engine': '${{ matrix.engine }}', 'source': 'd9460cae05cc32507facc8fb8c184ae8ed866e52', 'limits': 'Initial failure sentinel; only final supervisor and verifier reports can pass.'}, indent=2) + '\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 6d6a112e6b4edb769d7a1441f28490360bead257
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: website-privacy-qa
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
      - name: Record immutable test-only snapshot and runner context
        env:
          NS_QA_EXPECTED_SNAPSHOT: 6d6a112e6b4edb769d7a1441f28490360bead257
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, re, subprocess
          from pathlib import Path
          expected = os.environ['NS_QA_EXPECTED_SNAPSHOT']
          assert re.fullmatch('[0-9a-f]{40}', expected), 'ROOT has not bound a reviewed snapshot'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='32eed7b523bedef1d17aa0ab8c2ae11e45007bb6'
          lock=json.loads(Path('website-privacy-qa/capsule-lock.json').read_text())
          assert lock['source']=='d9460cae05cc32507facc8fb8c184ae8ed866e52'
          assert len(lock['files'])==18
          for filename,digest in lock['files'].items():
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest()==digest,filename
          assert hashlib.sha256(Path('website-privacy-qa/supervisor.py').read_bytes()).hexdigest()=='5a95427d9577a43c87b48215828dc9cd4407bec5370aa6a4b2e805bfd3ca7a4f'
          assert hashlib.sha256(Path('website-privacy-qa/controller-controls.py').read_bytes()).hexdigest()=='81da5b465688da19342ab5f6aa24f4c6686c259a6a503ee79e60f41ff090a9fa'
          files = ['website-privacy-qa/manifest.json', 'website-privacy-qa/supervisor.py', 'website-privacy-qa/controller-controls.py']
          record = {'snapshot': actual, 'snapshotTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'runner': platform.platform(), 'runnerPython': platform.python_version(), 'node': subprocess.check_output(['node', '--version'], text=True).strip(), 'expectedPlaywright': '1.64.1', 'controllerFiles': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}, 'actionReferences': {'checkout': 'fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09', 'setupNode': 'a0853c24544627f65ddf259abe73b1d18a591444', 'uploadArtifact': 'cf430e030ddbb5b0abf93d22962f4752f3646cd9'}, 'limits': 'Pinned official actions and exact reviewed source/controller snapshot; only browser privacy qualification, no hosted or publication proof.'}
          (Path(os.environ['RUNNER_TEMP']) / 'ns-web-qa-proof-${{ matrix.engine }}' / 'context.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Qualify actual controller functions without network
        run: |
          sudo --non-interactive /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=10s 60s \
            /usr/bin/unshare --net -- /usr/bin/python3 "$GITHUB_WORKSPACE/website-privacy-qa/controller-controls.py" \
            --supervisor "$GITHUB_WORKSPACE/website-privacy-qa/supervisor.py" \
            --proof "$RUNNER_TEMP/ns-web-qa-proof-${{ matrix.engine }}" \
            --work "$RUNNER_TEMP/ns-web-qa-controls-${{ matrix.engine }}" \
            --runner-uid "$(id -u)" --runner-gid "$(id -g)"
      - name: Bound dependencies, integrity, mock then actual SDK and owned cleanup
        run: |
          node_path="$(command -v node)"
          sudo --non-interactive /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=15s 730s \
            /usr/bin/python3 "$GITHUB_WORKSPACE/website-privacy-qa/supervisor.py" \
            --payload "$GITHUB_WORKSPACE/website-privacy-qa/payload" \
            --manifest "$GITHUB_WORKSPACE/website-privacy-qa/manifest.json" \
            --controls "$RUNNER_TEMP/ns-web-qa-proof-${{ matrix.engine }}/controller-controls.json" \
            --proof "$RUNNER_TEMP/ns-web-qa-proof-${{ matrix.engine }}" \
            --work "$RUNNER_TEMP/ns-web-qa-work-${{ matrix.engine }}" \
            --node "$node_path" --engine '${{ matrix.engine }}' \
            --runner-uid "$(id -u)" --runner-gid "$(id -g)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-privacy-d9460cae-${{ matrix.engine }}-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ns-web-qa-proof-${{ matrix.engine }}/initial.json
            ${{ runner.temp }}/ns-web-qa-proof-${{ matrix.engine }}/context.json
            ${{ runner.temp }}/ns-web-qa-proof-${{ matrix.engine }}/controller-controls.json
            ${{ runner.temp }}/ns-web-qa-proof-${{ matrix.engine }}/supervisor.json
            ${{ runner.temp }}/ns-web-qa-proof-${{ matrix.engine }}/mock.json
            ${{ runner.temp }}/ns-web-qa-proof-${{ matrix.engine }}/actual.json
