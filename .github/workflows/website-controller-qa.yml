name: Website controller qualification only
on:
  push:
    branches: [codex/website-controller-qa-20261030]
    paths: [.github/workflows/website-controller-qa.yml, website-privacy-qa/**]
permissions:
  contents: read
concurrency:
  group: website-controller-d946-once
  cancel-in-progress: false
jobs:
  controller:
    if: github.repository == 'hartican/sportscal' && github.ref == 'refs/heads/codex/website-controller-qa-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reserve failure evidence before checkout
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'website-controller-proof'
          p.mkdir()
          (p/'initial.json').write_text(json.dumps({'passed':False,'state':'not-started','scope':'Controller only; no dependency/browser/Meta/product operation'})+'\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: b41907d2a50fa53a6346775b924f748ba6638b09
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: website-privacy-qa
          sparse-checkout-cone-mode: true
      - name: Verify exact source, controllers and payload before execution
        env:
          EXPECTED_SNAPSHOT: b41907d2a50fa53a6346775b924f748ba6638b09
          EXPECTED_TREE: 6eb4550fa9a4384ca1eb607acbc6ff441b22f777
        run: |
          python3 - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          h=lambda b:hashlib.sha256(b).hexdigest()
          g=lambda *a:subprocess.check_output(['git',*a],text=True,timeout=5).strip()
          assert g('rev-parse','HEAD')==os.environ['EXPECTED_SNAPSHOT']
          assert g('rev-parse','HEAD^{tree}')==os.environ['EXPECTED_TREE']
          q=Path('website-privacy-qa');lock=json.loads((q/'capsule-lock.json').read_text())
          assert lock['source']=='d9460cae05cc32507facc8fb8c184ae8ed866e52'
          assert lock['sourceManifestSha256']=='ac3d76f83cdfe8c74b1d90bc36951df9dd390b461bdc4f259953ed50d70f92ce'
          assert len(lock['files'])==18
          for name,digest in lock['files'].items():
              p=Path(name);assert not p.is_symlink() and h(p.read_bytes())==digest,name
          expected={'supervisor.py':'9474c651dfaec69e6c65fccb60a30a7eb870e53b6a3b37a0b8667bb37d166a85','controller-controls.py':'7261c871ee99b85ff72cae8a8558b79ef16c6ef7374fa43ecb9a750feaf07fe7'}
          assert all(h((q/n).read_bytes())==digest for n,digest in expected.items())
          assert 'sdkEnabled:false' in (q/'payload/public/measurement-start.js').read_text()
          proof={'snapshot':g('rev-parse','HEAD'),'snapshotTree':g('rev-parse','HEAD^{tree}'),'source':lock['source'],'python':platform.python_version(),'platform':platform.platform(),'controllerFiles':expected,'scope':'Exact controller-only capsule; no Node/Playwright/browser/Meta qualification'}
          (Path(os.environ['RUNNER_TEMP'])/'website-controller-proof/context.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - name: Run actual controller controls without external network
        run: |
          sudo --non-interactive /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=10s 60s \
            /usr/bin/unshare --net -- /usr/bin/python3 "$GITHUB_WORKSPACE/website-privacy-qa/controller-controls.py" \
            --supervisor "$GITHUB_WORKSPACE/website-privacy-qa/supervisor.py" \
            --proof "$RUNNER_TEMP/website-controller-proof" \
            --work "$RUNNER_TEMP/website-controller-controls" \
            --runner-uid "$(id -u)" --runner-gid "$(id -g)"
      - name: Verify all twelve actual controls and final closure
        run: |
          python3 - <<'PY'
          import ast,hashlib,json,os
          from pathlib import Path
          q=Path('website-privacy-qa');p=Path(os.environ['RUNNER_TEMP'])/'website-controller-proof/controller-controls.json'
          d=json.loads(p.read_text());tree=ast.parse((q/'supervisor.py').read_text())
          names=next(ast.literal_eval(n.value)for n in tree.body if isinstance(n,ast.Assign)and any(isinstance(t,ast.Name)and t.id=='CONTROLS_REQUIRED'for t in n.targets))
          assert d['passed'] is True and len(d['cases'])==12
          assert [x['name']for x in d['cases']]==list(names) and all(x['passed']for x in d['cases'])
          assert d['networkNamespace']=='isolated-no-external-interface'
          assert d['supervisorSha256']==hashlib.sha256((q/'supervisor.py').read_bytes()).hexdigest()
          assert d['controlsSha256']==hashlib.sha256((q/'controller-controls.py').read_bytes()).hexdigest()
          assert d['finalCleanup']=={'actions':[],'remaining':[]}
          assert not (Path(os.environ['RUNNER_TEMP'])/'website-controller-controls').exists()
          print('Twelve actual controller controls passed; closure verified. Browser/Meta unrun.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-controller-d946-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/website-controller-proof/initial.json
            ${{ runner.temp }}/website-controller-proof/context.json
            ${{ runner.temp }}/website-controller-proof/controller-controls.json
