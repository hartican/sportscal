<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Live fixture · Nothing Sport</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#16161a;--line:#303037;--text:#fafafa;--muted:#aaaab2;--pink:#ff2d8d;--green:#55d68b;font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#321024 0,transparent 34rem),var(--bg);color:var(--text);min-height:100svh}a{color:inherit}button{font:inherit}.shell{width:min(760px,100%);margin:auto;padding:clamp(20px,5vw,54px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}.logo{width:210px;max-width:48vw}.back{color:var(--muted);text-decoration:none}.eyebrow{color:var(--pink);font-weight:900;letter-spacing:.13em;text-transform:uppercase}.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,42px);box-shadow:0 30px 90px #0008}h1{font-size:clamp(2rem,8vw,4rem);line-height:1.02;margin:.35rem 0 1rem}.hook{font-size:1.08rem;color:#d2d2d7}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:28px 0}.fact{border:1px solid var(--line);border-radius:16px;padding:15px}.fact span{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.fact strong{display:block;margin-top:5px}.countdown{font-variant-numeric:tabular-nums;font-size:clamp(1.4rem,5vw,2.3rem);font-weight:850;margin:28px 0}.actions{display:flex;flex-wrap:wrap;gap:12px}.button{border:0;border-radius:999px;padding:14px 22px;font-weight:800;cursor:pointer;background:var(--pink);color:#09090b}.button.secondary{background:#2a2a30;color:var(--text)}.button:disabled{opacity:.45;cursor:not-allowed}.rating{margin-top:30px;padding-top:28px;border-top:1px solid var(--line)}.stars{display:flex;gap:8px;margin:13px 0}.star{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:#222228;color:#fff;font-size:1.35rem}.star.selected{background:var(--pink);color:#09090b}.status{min-height:24px;color:var(--muted);margin-top:14px}.aggregate{margin-top:24px;color:var(--muted)}.aggregate strong{color:var(--text)}.privacy{font-size:.86rem;color:var(--muted);margin-top:28px}.empty{padding:70px 20px;text-align:center;color:var(--muted)}@media(max-width:520px){.facts{grid-template-columns:1fr}.actions>*{width:100%}.button{min-height:52px}.star{flex:1}}
  </style>
</head>
<body>
  <main class="shell">
    <header><a href="/" aria-label="Nothing Sport home"><img class="logo" src="/assets/brand/web/nothingsport-logo.png" alt="nothing SPORT"></a><a class="back" href="/">Back to feed</a></header>
    <section id="view" class="card" aria-live="polite"><div class="empty">Loading the fixture…</div></section>
  </main>
  <script>
  (()=>{
    const view=document.getElementById("view"); let candidate=null, snapshot=null, timer=null;
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    function eventId(){const params=new URLSearchParams(location.search);if(params.get("eventId"))return params.get("eventId");const match=location.pathname.match(/^\/fixture\/(.+)$/);return match?decodeURIComponent(match[1]):""}
    function clock(ms){if(ms<=0)return"Starting now";const days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000),secs=Math.floor(ms%60000/1000);return [days?`${days}d`:"",`${String(hours).padStart(2,"0")}h`,`${String(mins).padStart(2,"0")}m`,`${String(secs).padStart(2,"0")}s`].filter(Boolean).join(" ")}
    function render(){
      if(!candidate||!snapshot)return;
      const f=snapshot.fixture,a=snapshot.aggregate,now=Date.now(),start=Date.parse(f.startTimeUtc),open=Date.parse(f.rating.opensAt),closed=Date.parse(f.rating.closesAt),before=now<start;
      view.innerHTML=`<div class="eyebrow">${now>=start&&now<open?"● LIVE · ":""}5/5 stakes · ${esc(f.sport)}</div><h1>${esc(f.title)}</h1><p class="hook">${esc(f.hook)}</p>
      <div class="facts"><div class="fact"><span>Sydney start</span><strong>${esc(f.sydneyStart.date)} · ${esc(f.sydneyStart.time)} ${esc(f.sydneyStart.timezone)}</strong></div><div class="fact"><span>Expected finish</span><strong>${esc(f.sydneyFinish.time)} ${esc(f.sydneyFinish.timezone)}</strong></div><div class="fact"><span>Watch on</span><strong>${esc(f.broadcaster||"Provider TBC")}</strong></div><div class="fact"><span>Joined</span><strong>${a.joinedCount} ${a.joinedCount===1?"person":"people"}</strong></div></div>
      <div class="countdown" id="countdown">${before?`${clock(start-now)} to kickoff`:now<open?`${clock(open-now)} until ratings open`:now<=closed?"Ratings are open":"Rating window closed"}</div>
      <div class="actions"><button class="button" id="join" ${a.currentDevice.joined?"disabled":""}>${a.currentDevice.joined?"Joined":"Join this fixture"}</button><a class="button secondary" href="/" title="Open the Nothing Sport feed to find viewing options">Viewing options</a></div>
      <section class="rating"><div class="eyebrow">Rate it after the finish</div><div class="stars" role="group" aria-label="Fixture rating">${[1,2,3,4,5].map(n=>`<button class="star ${a.currentDevice.rating===n?"selected":""}" data-rating="${n}" ${f.rating.open?"":"disabled"} aria-label="${n} star${n===1?"":"s"}">★</button>`).join("")}</div><div>${f.rating.open?"One editable rating per device.":now<open?`Opens ${esc(f.sydneyFinish.date)} at ${esc(f.sydneyFinish.time)}.`:"This seven-day window has closed."}</div></section>
      <div class="aggregate"><strong>${a.averageRating??"Building"}</strong>${a.averageRating?" / 5":""} · ${a.ratingCount} rating${a.ratingCount===1?"":"s"}</div><div id="status" class="status"></div>
      <p class="privacy">No account or free text. Your browser receives an opaque, private cookie so joining and rating can be deduplicated; Nothing Sport stores only its server-side hash and never stores your raw IP address.</p>`;
      document.getElementById("join").onclick=()=>act({action:"join"});document.querySelectorAll("[data-rating]").forEach(button=>button.onclick=()=>act({action:"rate",rating:Number(button.dataset.rating)}));
      clearInterval(timer);timer=setInterval(()=>{const node=document.getElementById("countdown");if(!node)return;const t=Date.now();node.textContent=t<start?`${clock(start-t)} to kickoff`:t<open?`${clock(open-t)} until ratings open`:t<=closed?"Ratings are open":"Rating window closed"},1000);
    }
    async function load(){
      try{const artifact=await fetch("/data/marquee-candidates.v1.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Candidate feed unavailable");return r.json()});const id=eventId();candidate=id?artifact.candidates.find(c=>c.eventId===id):artifact.candidates.find(c=>Date.parse(c.timing.endTimeUtc)>Date.now())||artifact.candidates[0];if(!candidate)throw Error("No confirmed marquee fixture is currently available.");snapshot=await fetch(`/api/participation?eventId=${encodeURIComponent(candidate.eventId)}`,{credentials:"same-origin",cache:"no-store"}).then(async r=>{const p=await r.json();if(!r.ok)throw Error(p.error||"Participation unavailable");return p});history.replaceState(null,"",location.pathname==="/live"?`${location.pathname}${location.search}`:location.href);render()}catch(error){view.innerHTML=`<div class="empty"><h1>Fixture unavailable</h1><p>${esc(error.message)}</p><p><a href="/">Return to the feed</a></p></div>`}}
    async function act(command){const status=document.getElementById("status");status.textContent="Saving…";try{const response=await fetch("/api/participation",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({...command,eventId:candidate.eventId})});const payload=await response.json();if(!response.ok)throw Error(payload.error||"Could not save");snapshot=payload;render();document.getElementById("status").textContent=command.action==="join"?"You’re in.":"Rating saved."}catch(error){status.textContent=error.message}}
    load();
  })();
  </script>
</body>
</html>
